.lbtn{width:100%;background:var(--navy);color:#fff;border:none;border-radius:11px;padding:13px;font-size:14px;font-weight:500;font-family:'DM Sans',sans-serif;cursor:pointer;transition:background .2s,transform .1s;}

.tc-avg{font-size:11px;color:var(--t2);margin-left:auto;font-weight:500;}

/* Mobile First .g3 */
.g3{display:grid;grid-template-columns:1fr 1fr;gap:7px;}

input[type=number]{padding:9px 11px;border:1.5px solid #e5e7eb;border-radius:8px;font-size:14px;font-family:'DM Sans',sans-serif;color:var(--text);outline:none;width:100%;}

.ns-ico{width:50px;height:50px;border-radius:50%;background:rgba(255,255,255,.08);border:1.5px solid rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center;margin:0 auto 12px;}

.fmt-pill{display:inline-flex;background:#e8f0fe;border-radius:9px;padding:3px;gap:2px;}
.fmt-opt{padding:5px 13px;border-radius:7px;border:none;cursor:pointer;font-size:12px;font-weight:600;font-family:'Barlow Condensed',Impact,sans-serif;letter-spacing:.04em;color:var(--t2);background:transparent;transition:all .15s;}
.fmt-opt.on{background:var(--navy);color:#fff;box-shadow:0 1px 6px rgba(13,37,69,.25);}
/* LOADER */
@keyframes ldrIn{from{opacity:0}to{opacity:1}}
@keyframes ldotB{0%,80%,100%{opacity:.25;transform:translateY(0)}40%{opacity:1;transform:translateY(-5px)}}
@keyframes badgePulse{0%,100%{box-shadow:0 0 0 6px rgba(217,43,43,.18),0 16px 50px rgba(0,0,0,.4)}50%{box-shadow:0 0 0 14px rgba(217,43,43,.08),0 16px 50px rgba(0,0,0,.4)}}
/* PROFILE MODAL */
@keyframes slideUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
.prof-back{position:fixed;inset:0;z-index:2000;background:rgba(0,0,0,.55);backdrop-filter:blur(5px);display:flex;align-items:center;justify-content:center;padding:16px;animation:ldrIn .2s ease;}
.prof-card{background:#fff;border-radius:22px;padding:0;max-width:340px;width:100%;box-shadow:0 24px 80px rgba(0,0,0,.35);animation:slideUp .25s ease;overflow:hidden;}
.prof-hdr{background:linear-gradient(135deg,#060e1c,#0d2545);padding:24px 20px 18px;text-align:center;position:relative;}
.prof-close{position:absolute;top:10px;right:12px;background:rgba(255,255,255,.12);border:none;color:rgba(255,255,255,.7);width:28px;height:28px;border-radius:50%;cursor:pointer;font-size:15px;display:flex;align-items:center;justify-content:center;font-family:'DM Sans',sans-serif;}
.prof-close:hover{background:rgba(255,255,255,.2);color:#fff;}
.prof-body{padding:18px 20px;}
.stat-box{display:flex;gap:10px;}
.stat-item{flex:1;background:#f4f7fb;border-radius:10px;padding:12px 8px;text-align:center;}
.stat-val{font-family:'Barlow Condensed',Impact,sans-serif;font-size:26px;font-weight:700;color:var(--navy);}
.stat-lbl{font-size:10px;color:var(--t2);text-transform:uppercase;letter-spacing:.08em;margin-top:2px;}
/* VOTE SELECT */
select.vote-sel{width:100%;padding:11px 13px;border:1.5px solid #e5e7eb;border-radius:9px;font-size:14px;font-family:'DM Sans',sans-serif;color:var(--text);background:#fff;outline:none;transition:border-color .2s;appearance:auto;}
select.vote-sel:focus{border-color:var(--navy);}
@keyframes fUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

/* Desktop Adjustments (Scaling UP from mobile instead of scaling down) */
@media(min-width:480px){
  .g3{grid-template-columns:1fr 1fr 1fr;gap:9px;}
  .tc-nm{font-size:17px;}
  .atab{font-size:14px;padding:11px 4px;}
}
</style>

function hasST(){return typeof window!=='undefined'&&!!window.storage;}

function getFmt(){return ST.fmt||{mode:'3x5',perTeam:5,teams:3,target:15};}

async function SAVE(){if(!hasST())return;try{await window.storage.set('lues_p',JSON.stringify(ST.players.map(p=>({...p,photo:undefined}))));await window.storage.set('lues_w',JSON.stringify(ST.weeks));await window.storage.set('lues_fmt',JSON.stringify(ST.fmt));if(ST.user)await window.storage.set('lues_sess',JSON.stringify({user:ST.user,view:ST.view}));}catch(e){}}
async function savePh(id,d){if(!hasST())return;try{await window.storage.set('lues_ph_'+id,d);}catch(e){}}
async function LOAD(){
  if(!hasST())return;
  try{const r=await window.storage.get('lues_p');if(r)ST.players=JSON.parse(r.value);}catch(e){ST.players=[];}
  try{const r=await window.storage.get('lues_w');if(r)ST.weeks=JSON.parse(r.value);}catch(e){ST.weeks={};}
  try{const r=await window.storage.get('lues_fmt');if(r)ST.fmt={...ST.fmt,...JSON.parse(r.value)};}catch(e){}

function getAB(){return new Date(new Date().toLocaleString('en-US',{timeZone:'America/Edmonton'}));}
function isSun(){return getAB().getDay()===0;}
function after930(){const t=getAB();return t.getHours()>9||(t.getHours()===9&&t.getMinutes()>=30);}
function before7pm(){const t=getAB();return t.getHours()<19;}
function votingOpen(){return isSun()&&after930()&&before7pm();}
function todayKey(){const t=getAB();return`${t.getFullYear()}-${String(t.getMonth()+1).padStart(2,'0')}-${String(t.getDate()).padStart(2,'0')}`;}
function fmtT(iso){return new Date(iso).toLocaleTimeString('en-US',{timeZone:'America/Edmonton',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:true});}
function fmtD(k){return new Date(k+'T12:00:00').toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric'});}
function nowClock(){return new Date().toLocaleTimeString('en-US',{timeZone:'America/Edmonton',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:true});}
function msUntilNextVote(){
  const ab=getAB();const day=ab.getDay(),h=ab.getHours(),m=ab.getMinutes(),s=ab.getSeconds();
  const secsIntoDay=h*3600+m*60+s;
  // Voting open: Sunday 9:30 AM (34200s) to 7:00 PM (68400s)
  if(day===0&&secsIntoDay>=34200&&secsIntoDay<68400)return 0;
  let secsRemaining;
  if(day===0&&secsIntoDay<34200){secsRemaining=34200-secsIntoDay;} // today before 9:30
  else{const daysUntil=day===0?7:7-day;secsRemaining=daysUntil*86400-secsIntoDay+34200;} // next Sunday 9:30
  return Math.max(0,secsRemaining)*1000;
}
function fmtCountdown(ms){if(ms===0)return'OPEN NOW';const tot=Math.floor(ms/1000);const d=Math.floor(tot/86400),h=Math.floor((tot%86400)/3600),m2=Math.floor((tot%3600)/60),s2=tot%60;return d>0?`${d}d ${String(h).padStart(2,'0')}:${String(m2).padStart(2,'0')}:${String(s2).padStart(2,'0')}`:`${String(h).padStart(2,'0')}:${String(m2).padStart(2,'0')}:${String(s2).padStart(2,'0')}`;}

function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
function ini(n){return(n||'?').trim().split(/\s+/).map(w=>w[0]).join('').toUpperCase().slice(0,2);}
function sAvg(sk){if(!sk)return 5;const v=Object.values(sk);return Math.round(v.reduce((a,b)=>a+b,0)/v.length);}
function sCol(v){return v>=8?'#22c55e':v>=6?'#3b82f6':v>=4?'#f59e0b':'#ef4444';}
function escH(s){return(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function ovCls(v){return v>=8?'og':v>=6?'ob':v>=4?'oa':'or';}
function ballSVG(sz,c){sz=sz||26;c=c||'white';return`<svg width="${sz}" height="${sz}" viewBox="0 0 34 34" fill="none"><circle cx="17" cy="17" r="14" stroke="${c}" stroke-width="1.5"/><ellipse cx="17" cy="17" rx="6" ry="14" stroke="${c}" stroke-width="1" fill="none"/><line x1="3" y1="17" x2="31" y2="17" stroke="${c}" stroke-width="1"/><path d="M3.8 11Q17 14 30.2 11" stroke="${c}" stroke-width="1" fill="none"/><path d="M3.8 23Q17 20 30.2 23" stroke="${c}" stroke-width="1" fill="none"/></svg>`;}

function avH(name,photo,sz){
  sz=sz||40;const s=`width:${sz}px;height:${sz}px;border-radius:50%;flex-shrink:0;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:${Math.round(sz*.32)}px;font-weight:500;`;
  if(photo)return`<div style="${s}"><img src="${photo}" style="width:100%;height:100%;object-fit:cover;border-radius:50%;"></div>`;
  return`<div style="${s}background:linear-gradient(135deg,#dbeafe,#bfdbfe);color:#1e40af;">${ini(name)}</div>`;
}
function sBars(sk){
  if(!sk)return'<div style="font-size:12px;color:var(--t2);padding:4px 0;">No skill data in roster.</div>';
  return[['Speed','speed'],['Shoot','shooting'],['Pass','passing'],['Def','defense'],['Stam','stamina']].map(([l,k])=>{
    const v=sk[k]||5;return`<div class="sb"><span class="sb-l">${l}</span><div class="sb-t"><div class="sb-f" style="width:${v*10}%;background:${sCol(v)};"></div></div><span class="sb-v">${v}</span></div>`;
  }).join('');
}

function playerStats(name){
  let won=0,played=0;
  Object.values(ST.weeks).forEach(w=>{
    if(!w.votes)return;
    if(!w.votes.some(v=>v.name.toLowerCase()===name.toLowerCase()))return;
    played++;
    if(!w.teams||!w.gamesWon)return;
    ['red','white','blue'].forEach(c=>{
      if((w.teams[c]||[]).some(p=>p.name.toLowerCase()===name.toLowerCase()))won+=(w.gamesWon[c]||0);
    });
  });
  return{won,played};
}

}

/* ─── TEAM GENERATION ─── */
function genTeams(votes){
  const fmt=getFmt();const T=fmt.target,nT=fmt.teams;
  const first=votes.slice(0,T).map(v=>{
    const pl=ST.players.find(p=>p.name.toLowerCase()===v.name.toLowerCase());
    return{name:v.name,timestamp:v.timestamp,skills:pl&&pl.skills?pl.skills:null,photo:pl?pl.photo||null:null,overall:pl?sAvg(pl.skills):5};
  });
  const subs=votes.slice(T).map(v=>({name:v.name,timestamp:v.timestamp}));
  first.sort((a,b)=>b.overall-a.overall);
  const teams=Array.from({length:nT},()=>[]);
  for(let i=0;i<first.length;i++){const round=Math.floor(i/nT),pos=i%nT,ti=round%2===0?pos:(nT-1-pos);teams[ti].push(first[i]);}
  return nT===3?{red:teams[0],white:teams[1],blue:teams[2],subs}:{red:teams[0],white:teams[1],subs};
}
