<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d2545">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>LUES Soccer Club</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&display=swap" rel="stylesheet">

<!-- ── FIREBASE SDK ── -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>

<style>
/* ── TOKENS ── */
:root{
  --navy:#0d2545;--navy2:#1b3d6e;--navy3:#0a1e38;
  --red:#d92b2b;--red2:#b91c1c;
  --blue:#1d4ed8;--blue2:#1e3a8a;
  --green:#16a34a;--amber:#b45309;
  --bg:#eef2f7;--bg2:#f8fafc;--text:#111827;--t2:#6b7280;--t3:#9ca3af;
  --bdr:rgba(0,0,0,.07);
  --sh:0 1px 8px rgba(13,37,69,.08),0 4px 16px rgba(13,37,69,.06);
  --sh2:0 8px 32px rgba(13,37,69,.16);
  --r:16px;--r2:12px;
  --safe-t:env(safe-area-inset-top,0px);
  --safe-b:env(safe-area-inset-bottom,0px);
  --safe-l:env(safe-area-inset-left,0px);
  --safe-r:env(safe-area-inset-right,0px);
  --nav-h:72px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html{height:100%;-webkit-text-size-adjust:100%;}
body,#la{
  font-family:'DM Sans',-apple-system,sans-serif;
  color:var(--text);background:var(--bg);
  min-height:100%;overscroll-behavior:none;
}
button,select,input,a{touch-action:manipulation;-webkit-tap-highlight-color:transparent;}
img{-webkit-user-drag:none;user-select:none;}

/* ── ANIMATIONS ── */
@keyframes fUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes fIn{from{opacity:0}to{opacity:1}}
@keyframes ldrIn{from{opacity:0}to{opacity:1}}
@keyframes ldotB{0%,80%,100%{opacity:.25;transform:translateY(0)}40%{opacity:1;transform:translateY(-6px)}}
@keyframes badgePulse{0%,100%{box-shadow:0 0 0 6px rgba(217,43,43,.18),0 20px 60px rgba(0,0,0,.4)}50%{box-shadow:0 0 0 18px rgba(217,43,43,.06),0 20px 60px rgba(0,0,0,.4)}}
@keyframes sheetUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
@keyframes slideUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
@keyframes tabPop{0%{transform:scale(1)}50%{transform:scale(1.18)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

/* ── LOGIN ── */
.lwrap{
  min-height:100svh;
  background:linear-gradient(155deg,#060e1c 0%,#0d2545 55%,#163260 100%);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:calc(2rem + var(--safe-t)) 1.25rem calc(3rem + var(--safe-b));
  animation:fIn .5s ease;
}
.lbadge{
  width:92px;height:92px;border-radius:50%;
  background:rgba(255,255,255,.06);
  border:2.5px solid var(--red);
  display:flex;align-items:center;justify-content:center;
  margin-bottom:16px;
  box-shadow:0 0 0 10px rgba(217,43,43,.1),0 20px 60px rgba(0,0,0,.4);
  animation:badgePulse 2s ease infinite;
}
.ltitle{font-family:'Barlow Condensed',Impact,sans-serif;font-size:40px;font-weight:700;color:#fff;letter-spacing:.05em;margin-bottom:4px;}
.lsub{font-size:12px;color:rgba(255,255,255,.35);text-transform:uppercase;letter-spacing:.16em;margin-bottom:32px;}
.lcard{
  width:100%;max-width:420px;
  background:#fff;border-radius:24px;
  padding:28px 22px 24px;
  box-shadow:0 32px 80px rgba(0,0,0,.42);
  animation:slideUp .4s cubic-bezier(.32,0,.67,0) .1s both;
}
.lcard h3{font-size:17px;font-weight:600;color:var(--text);margin-bottom:22px;}
.lf{margin-bottom:16px;}
.lf label{display:block;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.11em;color:var(--t2);margin-bottom:8px;}
.lf input{
  width:100%;padding:15px 16px;
  border:1.5px solid #e5e7eb;border-radius:13px;
  font-size:16px;font-family:'DM Sans',sans-serif;color:var(--text);
  outline:none;transition:border-color .2s,box-shadow .2s;
  -webkit-appearance:none;
}
.lf input:focus{border-color:var(--navy);box-shadow:0 0 0 3px rgba(13,37,69,.08);}
.lerr{font-size:13px;color:var(--red);margin-bottom:12px;display:none;animation:shake .35s ease;}
.lbtn{
  width:100%;background:var(--navy);color:#fff;border:none;
  border-radius:14px;padding:17px;font-size:16px;font-weight:600;
  font-family:'DM Sans',sans-serif;cursor:pointer;
  transition:background .15s,transform .1s;min-height:56px;letter-spacing:.01em;
}
.lbtn:active{background:var(--navy2);transform:scale(.98);}
.lhint{font-size:12px;color:var(--t3);text-align:center;margin-top:14px;}
.lvote-status{
  margin-top:22px;text-align:center;
  animation:slideUp .5s cubic-bezier(.32,0,.67,0) .25s both;
}

/* ── APP SHELL ── */
.ahdr{
  position:sticky;top:0;z-index:200;
  background:var(--navy);
  padding:calc(10px + var(--safe-t)) 16px 10px;
  display:flex;align-items:center;justify-content:space-between;
  color:#fff;box-shadow:0 2px 16px rgba(0,0,0,.3);
}
.ahdr-brand{display:flex;align-items:center;gap:10px;}
.ahdr-ico{
  width:38px;height:38px;border-radius:12px;
  background:rgba(255,255,255,.1);
  border:1.5px solid rgba(255,255,255,.2);
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
.ahdr-nm{font-family:'Barlow Condensed',Impact,sans-serif;font-size:19px;font-weight:700;letter-spacing:.04em;}
.ahdr-rl{font-size:10px;opacity:.45;margin-top:1px;letter-spacing:.05em;text-transform:uppercase;}
.sout{
  background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);
  color:#fff;padding:9px 16px;border-radius:10px;cursor:pointer;
  font-size:13px;font-family:'DM Sans',sans-serif;font-weight:500;
  min-height:40px;display:flex;align-items:center;transition:background .15s;
}
.sout:active{background:rgba(255,255,255,.25);}

/* ── BOTTOM NAV ── */
.anav{
  position:fixed;bottom:0;left:0;right:0;z-index:200;
  background:#fff;
  border-top:1px solid rgba(0,0,0,.08);
  display:flex;
  padding-bottom:var(--safe-b);
  box-shadow:0 -4px 20px rgba(13,37,69,.1);
}
.atab{
  flex:1;padding:10px 4px 8px;
  border:none;background:transparent;
  font-family:'DM Sans',sans-serif;font-size:10px;font-weight:500;
  letter-spacing:.03em;color:var(--t3);cursor:pointer;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:3px;transition:color .15s;
  min-height:calc(56px + var(--safe-b));
  -webkit-tap-highlight-color:transparent;
}
.atab svg{transition:transform .2s cubic-bezier(.34,1.56,.64,1);}
.atab.on{color:var(--navy);}
.atab.on svg{transform:scale(1.15);}
.atab.on .tab-dot{display:block;}
.tab-dot{display:none;width:4px;height:4px;border-radius:50%;background:var(--red);position:absolute;top:7px;}
.tab-lbl{font-family:'Barlow Condensed',Impact,sans-serif;font-size:12px;font-weight:700;letter-spacing:.04em;}
.atab:active svg{animation:tabPop .25s ease;}

/* ── MAIN CONTENT ── */
#lc{
  padding:14px;
  padding-bottom:calc(var(--nav-h) + 16px + var(--safe-b));
  animation:fUp .25s ease;
}
#lc.login-mode{padding:0;padding-bottom:0;}

/* ── CARDS ── */
.card{background:#fff;border-radius:var(--r);padding:16px;margin-bottom:12px;box-shadow:var(--sh);}
.sec{background:#f4f7fb;border-radius:var(--r);padding:14px 16px;margin-bottom:12px;border:1px solid var(--bdr);}

/* ── BUTTONS ── */
.btn{
  padding:11px 17px;border-radius:12px;
  border:1.5px solid #e5e7eb;background:#fff;cursor:pointer;
  font-size:14px;font-weight:500;font-family:'DM Sans',sans-serif;color:var(--text);
  min-height:46px;display:inline-flex;align-items:center;justify-content:center;
  gap:6px;transition:background .12s,transform .1s,box-shadow .12s;
  letter-spacing:.01em;
}
.btn:active{background:#f3f4f6;transform:scale(.97);}
.btn-p{background:var(--navy)!important;color:#fff!important;border-color:var(--navy)!important;}
.btn-p:active{background:var(--navy2)!important;}
.btn-d{background:#fef2f2!important;color:#dc2626!important;border-color:#fca5a5!important;}
.btn-w{background:#fffbeb!important;color:#b45309!important;border-color:#fde68a!important;}
.bsm{padding:9px 13px!important;font-size:13px!important;min-height:40px!important;}

/* ── BADGES ── */
.badge{display:inline-flex;align-items:center;padding:4px 10px;border-radius:20px;font-size:12px;font-weight:500;}
.bs{background:#dcfce7;color:#15803d;}
.bd{background:#fee2e2;color:#dc2626;}
.bw{background:#fef3c7;color:#b45309;}

/* ── FORM GROUPS ── */
.fg{display:flex;flex-direction:column;margin-bottom:14px;}
.fg label{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.1em;color:var(--t2);margin-bottom:8px;}
.fg input,.fg select{
  width:100%;padding:14px 15px;
  border:1.5px solid #e5e7eb;border-radius:12px;
  font-size:16px;font-family:'DM Sans',sans-serif;color:var(--text);
  background:#fff;outline:none;
  transition:border-color .2s,box-shadow .2s;
  -webkit-appearance:none;appearance:none;
  min-height:52px;
}
.fg select{appearance:auto;-webkit-appearance:auto;}
.fg input:focus,.fg select:focus{border-color:var(--navy);box-shadow:0 0 0 3px rgba(13,37,69,.07);}

/* ── PLAYER CARDS ── */
.plcard{
  display:flex;align-items:flex-start;gap:12px;
  padding:15px;background:#fff;border-radius:var(--r);
  margin-bottom:10px;box-shadow:var(--sh);cursor:pointer;
  transition:transform .1s,box-shadow .1s;
}
.plcard:active{transform:scale(.985);box-shadow:var(--sh2);}

/* ── SKILL BARS ── */
.sb{display:flex;align-items:center;gap:7px;margin:4px 0;}
.sb-l{font-size:11px;color:var(--t3);width:44px;flex-shrink:0;}
.sb-t{flex:1;height:5px;background:#f3f4f6;border-radius:3px;overflow:hidden;}
.sb-f{height:100%;border-radius:3px;}
.sb-v{font-size:11px;color:var(--t3);width:16px;text-align:right;font-weight:500;}

/* ── OVERALL BADGE ── */
.ovb{border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0;color:#fff;}
.og{background:linear-gradient(135deg,#22c55e,#16a34a);}
.ob{background:linear-gradient(135deg,#3b82f6,#1d4ed8);}
.oa{background:linear-gradient(135deg,#f59e0b,#d97706);}
.or{background:linear-gradient(135deg,#ef4444,#dc2626);}

/* ── VOTER LIST ── */
.vrow{
  display:flex;justify-content:space-between;align-items:center;
  padding:11px 13px;background:#f8fafc;border-radius:11px;
  margin-bottom:7px;min-height:50px;
  transition:background .1s;cursor:pointer;
}
.vrow:active{background:#f0f4f8;}
.vnum{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0;}

/* ── TEAM CARDS ── */
.tcard{border-radius:var(--r);padding:16px;margin-bottom:12px;border-left:4px solid;box-shadow:var(--sh);}
.tc-r{border-left-color:var(--red);background:#fffafa;}
.tc-w{border-left-color:#4b5563;background:#fff;}
.tc-b{border-left-color:var(--blue);background:#f8faff;}
.tc-s{border-left-color:#9ca3af;background:#f9fafb;}
.tc-hdr{display:flex;align-items:center;gap:9px;margin-bottom:13px;}
.tcdot{width:12px;height:12px;border-radius:50%;flex-shrink:0;}
.tc-nm{font-family:'Barlow Condensed',Impact,sans-serif;font-size:20px;font-weight:700;letter-spacing:.02em;}
.tc-avg{font-size:12px;color:var(--t2);margin-left:auto;font-weight:500;}

/* ── PLAYER ROWS IN TEAMS ── */
.prow{
  display:flex;align-items:center;gap:10px;
  padding:11px 0;border-bottom:1px solid #f3f4f6;
  cursor:pointer;min-height:50px;
  transition:background .1s;
}
.prow:last-child{border-bottom:none;}
.prow:active{background:#f9fafb;border-radius:10px;padding-left:8px;margin-left:-8px;}

/* ── PROGRESS BAR ── */
.prog{height:7px;background:#e5e7eb;border-radius:4px;overflow:hidden;margin-bottom:16px;}
.prog-f{height:100%;background:linear-gradient(90deg,var(--navy),#2563eb);border-radius:4px;transition:width .5s cubic-bezier(.4,0,.2,1);}

/* ── HISTORY ROWS ── */
.hrow{
  display:flex;justify-content:space-between;align-items:center;
  padding:16px;background:#fff;border-radius:var(--r);
  margin-bottom:9px;cursor:pointer;box-shadow:var(--sh);min-height:66px;
  transition:transform .1s,box-shadow .1s;
}
.hrow:active{transform:scale(.985);box-shadow:var(--sh2);}

/* ── LEADERBOARD ROWS ── */
.wrow{
  display:flex;align-items:center;gap:13px;
  padding:14px 15px;background:#fff;border-radius:var(--r);
  margin-bottom:9px;box-shadow:var(--sh);min-height:62px;
  transition:transform .1s;cursor:pointer;
}
.wrow:active{transform:scale(.985);}
.wrnk{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex-shrink:0;}
.r1{background:linear-gradient(135deg,#ffd700,#f59e0b);color:#7c3a00;}
.r2{background:linear-gradient(135deg,#e2e8f0,#cbd5e1);color:#334155;}
.r3{background:linear-gradient(135deg,#d97706,#92400e);color:#fff;}
.rn{background:#f3f4f6;color:var(--t2);}

/* ── MISC ── */
.divider{height:1px;background:#f3f4f6;margin:16px 0;}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;}
.sec-title{font-family:'Barlow Condensed',Impact,sans-serif;font-size:24px;font-weight:700;letter-spacing:.02em;color:var(--navy);}
.empty-s{text-align:center;padding:3.5rem 1rem;color:var(--t2);font-size:14px;}
.wdate{font-family:'Barlow Condensed',Impact,sans-serif;font-size:21px;font-weight:700;color:var(--navy);letter-spacing:.02em;}

/* ── SKILL SLIDERS ── */
.sk-row{margin-bottom:14px;}
.sk-row label{display:flex;justify-content:space-between;font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--t2);margin-bottom:7px;font-weight:600;}
.sk-row input[type=range]{width:100%;accent-color:var(--navy);height:32px;cursor:pointer;}

/* ── NUMBER INPUTS ── */
input[type=number]{
  padding:13px;border:1.5px solid #e5e7eb;
  border-radius:12px;font-size:18px;font-family:'DM Sans',sans-serif;
  color:var(--text);outline:none;width:100%;text-align:center;
  min-height:54px;-webkit-appearance:none;font-weight:600;
}
input[type=number]:focus{border-color:var(--navy);box-shadow:0 0 0 3px rgba(13,37,69,.07);}

/* ── ADV ROW ── */
.adv-row{display:flex;gap:9px;align-items:stretch;}
.adv-row select,.adv-row input{
  flex:1;padding:13px 14px;border:1.5px solid #e5e7eb;
  border-radius:12px;font-size:16px;font-family:'DM Sans',sans-serif;
  outline:none;background:#fff;color:var(--text);min-height:52px;
  transition:border-color .2s;
}
.adv-row select:focus,.adv-row input:focus{border-color:var(--navy);}

/* ── NO SESSION ── */
.nosession{
  min-height:240px;background:linear-gradient(155deg,#060e1c,#0d2545);
  border-radius:var(--r);display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  padding:2.5rem 1.5rem;margin-bottom:12px;color:#fff;text-align:center;
  box-shadow:var(--sh2);
}
.ns-ico{width:58px;height:58px;border-radius:50%;background:rgba(255,255,255,.08);border:1.5px solid rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center;margin:0 auto 16px;}
.ns-title{font-family:'Barlow Condensed',Impact,sans-serif;font-size:26px;font-weight:700;letter-spacing:.04em;margin-bottom:7px;}
.ns-sub{font-size:13px;color:rgba(255,255,255,.4);margin-bottom:12px;}
.ns-clock{font-family:'Barlow Condensed',Impact,sans-serif;font-size:26px;font-weight:700;letter-spacing:.06em;color:rgba(255,255,255,.65);}

/* ── FORMAT BANNER ── */
.sfmt{
  display:flex;align-items:center;gap:10px;padding:13px 15px;
  background:linear-gradient(90deg,#f0f4ff,#e8f0fe);
  border-radius:14px;margin-bottom:12px;border:1px solid #c7d7fe;flex-wrap:wrap;
}
.sfmt-lbl{font-size:13px;font-weight:500;color:var(--navy2);flex:1;min-width:120px;}
.fmt-pill{display:inline-flex;background:#e0e8ff;border-radius:10px;padding:3px;gap:2px;}
.fmt-opt{
  padding:9px 18px;border-radius:8px;border:none;cursor:pointer;
  font-size:13px;font-weight:700;font-family:'Barlow Condensed',Impact,sans-serif;
  letter-spacing:.04em;color:var(--t2);background:transparent;
  transition:all .15s;min-height:38px;
}
.fmt-opt.on{background:var(--navy);color:#fff;box-shadow:0 2px 8px rgba(13,37,69,.25);}
.fmt-opt:active{opacity:.85;}

/* ── VOTE SELECT ── */
select.vote-sel{
  width:100%;padding:14px 15px;border:1.5px solid #e5e7eb;
  border-radius:13px;font-size:16px;font-family:'DM Sans',sans-serif;
  color:var(--text);background:#fff;outline:none;
  transition:border-color .2s;min-height:54px;
}
select.vote-sel:focus{border-color:var(--navy);}

/* ── CHECK-IN CTA CARD ── */
.cta-card{
  background:linear-gradient(135deg,var(--navy),var(--navy2));
  border-radius:var(--r);padding:18px;margin-bottom:12px;
  box-shadow:0 8px 24px rgba(13,37,69,.3);color:#fff;
}
.cta-card .cta-title{font-family:'Barlow Condensed',Impact,sans-serif;font-size:20px;font-weight:700;letter-spacing:.03em;margin-bottom:4px;}
.cta-card .cta-sub{font-size:12px;color:rgba(255,255,255,.55);margin-bottom:14px;}

/* ── PROFILE MODAL ── */
.prof-back{
  position:fixed;inset:0;z-index:2000;
  background:rgba(0,0,0,.6);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  display:flex;align-items:flex-end;justify-content:center;
  animation:fIn .2s ease;
}
.prof-card{
  background:#fff;border-radius:24px 24px 0 0;
  width:100%;max-width:500px;
  box-shadow:0 -12px 50px rgba(0,0,0,.3);
  animation:sheetUp .35s cubic-bezier(.32,0,.67,0);
  overflow:hidden;max-height:88svh;overflow-y:auto;
  -webkit-overflow-scrolling:touch;
  padding-bottom:var(--safe-b);
}
.prof-handle{width:36px;height:4px;border-radius:2px;background:rgba(0,0,0,.12);margin:10px auto 0;}
.prof-hdr{
  background:linear-gradient(135deg,#060e1c,#0d2545);
  padding:20px 22px 24px;text-align:center;position:relative;
}
.prof-close{
  position:absolute;top:14px;right:14px;
  background:rgba(255,255,255,.14);border:none;
  color:rgba(255,255,255,.8);width:36px;height:36px;
  border-radius:50%;cursor:pointer;font-size:20px;
  display:flex;align-items:center;justify-content:center;
  font-family:'DM Sans',sans-serif;transition:background .15s;
}
.prof-close:active{background:rgba(255,255,255,.28);}
.prof-body{padding:20px 22px 8px;}
.stat-box{display:flex;gap:10px;}
.stat-item{flex:1;background:#f4f7fb;border-radius:14px;padding:16px 8px;text-align:center;}
.stat-val{font-family:'Barlow Condensed',Impact,sans-serif;font-size:30px;font-weight:700;color:var(--navy);}
.stat-lbl{font-size:11px;color:var(--t2);text-transform:uppercase;letter-spacing:.08em;margin-top:3px;font-weight:500;}

/* ── LOADER ── */

async function SAVE() {
  showSync('Saving…');
  try {
    // Store players as object keyed by id (avoids Firebase sparse-array issues)
    const playersObj = {};
    ST.players.forEach(p => {
      const { photo, ...rest } = p; // photos stored separately
      playersObj[p.id] = rest;
    });
    await db.ref('lues/players').set(Object.keys(playersObj).length ? playersObj : null);
    await db.ref('lues/weeks').set(Object.keys(ST.weeks).length ? ST.weeks : null);
    await db.ref('lues/fmt').set(ST.fmt);
    showSync('Saved ✓');
    hideSync(1400);
  } catch(e) {
    console.error('SAVE error:', e);
    showSync('Save failed ✗');
    hideSync(2500);
  }
}

async function savePh(id, data) {
  try {
    await db.ref('lues/photos/' + id).set(data);
  } catch(e) { console.error('savePh error:', e); }
}

async function LOAD() {
  try {
    const snap = await db.ref('lues').get();
    if (snap.exists()) {
      const data = snap.val();
      // Players — stored as object keyed by id
      if (data.players && typeof data.players === 'object') {
        ST.players = Object.values(data.players);
      } else {
        ST.players = [];
      }
      // Attach photos
      if (data.photos) {
        ST.players.forEach(p => {
          if (data.photos[p.id]) p.photo = data.photos[p.id];
        });
      }
      // Weeks
      ST.weeks = data.weeks || {};
      // Format
      if (data.fmt) ST.fmt = { ...ST.fmt, ...data.fmt };
    }
  } catch(e) {
    console.error('LOAD error:', e);
    ST.players = [];
    ST.weeks = {};
  }

  // Session stored in localStorage (per-device login state)
  try {
    const sess = localStorage.getItem('lues_sess');
    if (sess) {
      const s = JSON.parse(sess);
      if (s && s.user) {
        ST.user = s.user;
        ST.view = s.view || (s.user.role === 'admin' ? 'aw' : 'uh');
      }
    }
  } catch(e) {}
}

function saveSession() {

function getAB(){return new Date(new Date().toLocaleString('en-US',{timeZone:'America/Edmonton'}));}
function isSun(){return getAB().getDay()===0;}
function after930(){const t=getAB();return t.getHours()>9||(t.getHours()===9&&t.getMinutes()>=30);}
function before7pm(){const t=getAB();return t.getHours()<19;}

function todayKey(){const t=getAB();return`${t.getFullYear()}-${String(t.getMonth()+1).padStart(2,'0')}-${String(t.getDate()).padStart(2,'0')}`;}
function fmtT(iso){return new Date(iso).toLocaleTimeString('en-US',{timeZone:'America/Edmonton',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:true});}
function fmtD(k){return new Date(k+'T12:00:00').toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric'});}
function nowClock(){return new Date().toLocaleTimeString('en-US',{timeZone:'America/Edmonton',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:true});}
function msUntilNextVote(){
  const ab=getAB();const day=ab.getDay(),h=ab.getHours(),m=ab.getMinutes(),s=ab.getSeconds();
  const secsIntoDay=h*3600+m*60+s;
  if(day===0&&secsIntoDay>=34200&&secsIntoDay<68400)return 0;
  let secsRemaining;
  if(day===0&&secsIntoDay<34200){secsRemaining=34200-secsIntoDay;}
  else{const daysUntil=day===0?7:7-day;secsRemaining=daysUntil*86400-secsIntoDay+34200;}
  return Math.max(0,secsRemaining)*1000;
}
function fmtCountdown(ms){if(ms===0)return'OPEN NOW';const tot=Math.floor(ms/1000);const d=Math.floor(tot/86400),h=Math.floor((tot%86400)/3600),m2=Math.floor((tot%3600)/60),s2=tot%60;return d>0?`${d}d ${String(h).padStart(2,'0')}:${String(m2).padStart(2,'0')}:${String(s2).padStart(2,'0')}`:`${String(h).padStart(2,'0')}:${String(m2).padStart(2,'0')}:${String(s2).padStart(2,'0')}`;}

function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
function ini(n){return(n||'?').trim().split(/\s+/).map(w=>w[0]).join('').toUpperCase().slice(0,2);}
function sAvg(sk){if(!sk)return 5;const v=Object.values(sk);return Math.round(v.reduce((a,b)=>a+b,0)/v.length);}
function sCol(v){return v>=8?'#22c55e':v>=6?'#3b82f6':v>=4?'#f59e0b':'#ef4444';}
function escH(s){return(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function ovCls(v){return v>=8?'og':v>=6?'ob':v>=4?'oa':'or';}
function ballSVG(sz,c){sz=sz||26;c=c||'white';return`<svg width="${sz}" height="${sz}" viewBox="0 0 34 34" fill="none"><circle cx="17" cy="17" r="14" stroke="${c}" stroke-width="1.5"/><ellipse cx="17" cy="17" rx="6" ry="14" stroke="${c}" stroke-width="1" fill="none"/><line x1="3" y1="17" x2="31" y2="17" stroke="${c}" stroke-width="1"/><path d="M3.8 11Q17 14 30.2 11" stroke="${c}" stroke-width="1" fill="none"/><path d="M3.8 23Q17 20 30.2 23" stroke="${c}" stroke-width="1" fill="none"/></svg>`;}

function avH(name,photo,sz){
  sz=sz||40;const s=`width:${sz}px;height:${sz}px;border-radius:50%;flex-shrink:0;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:${Math.round(sz*.32)}px;font-weight:600;`;
  if(photo)return`<div style="${s}"><img src="${photo}" style="width:100%;height:100%;object-fit:cover;border-radius:50%;"></div>`;
  return`<div style="${s}background:linear-gradient(135deg,#dbeafe,#bfdbfe);color:#1e40af;">${ini(name)}</div>`;
}
function sBars(sk){
  if(!sk)return'<div style="font-size:12px;color:var(--t2);padding:4px 0;">No skill data in roster.</div>';
  return[['Speed','speed'],['Shoot','shooting'],['Pass','passing'],['Def','defense'],['Stam','stamina']].map(([l,k])=>{
    const v=sk[k]||5;return`<div class="sb"><span class="sb-l">${l}</span><div class="sb-t"><div class="sb-f" style="width:${v*10}%;background:${sCol(v)};"></div></div><span class="sb-v">${v}</span></div>`;
  }).join('');
}
function playerStats(name){
  let won=0,played=0;
  Object.values(ST.weeks).forEach(w=>{
    if(!w.votes)return;
    if(!w.votes.some(v=>v.name.toLowerCase()===name.toLowerCase()))return;
    played++;
    if(!w.teams||!w.gamesWon)return;
    ['red','white','blue'].forEach(c=>{
      if((w.teams[c]||[]).some(p=>p.name.toLowerCase()===name.toLowerCase()))won+=(w.gamesWon[c]||0);
    });
  });
  return{won,played};
}

function genTeams(votes){
  const fmt=getFmt();const T=fmt.target,nT=fmt.teams;
  const first=votes.slice(0,T).map(v=>{
    const pl=ST.players.find(p=>p.name.toLowerCase()===v.name.toLowerCase());
    return{name:v.name,timestamp:v.timestamp,skills:pl&&pl.skills?pl.skills:null,photo:pl?pl.photo||null:null,overall:pl?sAvg(pl.skills):5};
  });
  const subs=votes.slice(T).map(v=>({name:v.name,timestamp:v.timestamp}));
  first.sort((a,b)=>b.overall-a.overall);
  const teams=Array.from({length:nT},()=>[]);
  for(let i=0;i<first.length;i++){const round=Math.floor(i/nT),pos=i%nT,ti=round%2===0?pos:(nT-1-pos);teams[ti].push(first[i]);}
  return nT===3?{red:teams[0],white:teams[1],blue:teams[2],subs}:{red:teams[0],white:teams[1],subs};
}

    </div>`;
  }
  let teamsHTML='';
  if(hasTeams&&week.teams){
    const t=week.teams;teamsHTML=`<div class="sec-title" style="margin-bottom:10px;">Teams</div>`;
    const defs=fmt.mode==='2x7'?[{k:'red',lbl:'Red Team',cls:'tc-r',dot:'#d92b2b'},{k:'white',lbl:'White Team',cls:'tc-w',dot:'#4b5563'}]:[{k:'red',lbl:'Red Team',cls:'tc-r',dot:'#d92b2b'},{k:'white',lbl:'White Team',cls:'tc-w',dot:'#4b5563'},{k:'blue',lbl:'Blue Team',cls:'tc-b',dot:'#1d4ed8'}];
    defs.forEach(d=>{
      const players=t[d.k]||[];const avg=players.length?Math.round(players.reduce((s,p)=>s+p.overall,0)/players.length):0;
      teamsHTML+=`<div class="tcard ${d.cls}"><div class="tc-hdr"><div class="tcdot" style="background:${d.dot};"></div><span class="tc-nm">${d.lbl}</span><span class="tc-avg">Avg ${avg}/10</span></div>
        ${players.map(p=>{const rp=ST.players.find(r=>r.name.toLowerCase()===p.name.toLowerCase());const ctry=rp&&rp.nationality?COUNTRIES.find(c=>c.n===rp.nationality):null;return`<div class="prow" onclick="showProfile('${escH(p.name)}')">${avH(p.name,(rp&&rp.photo)||p.photo,32)}<span style="font-size:13px;font-weight:500;flex:1;">${escH(p.name)} ${ctry?ctry.f:''}</span><div class="ovb ${ovCls(p.overall)}" style="width:28px;height:28px;font-size:11px;">${p.overall}</div></div>`;}).join('')}
      </div>`;
    });
    if(isAdmin){
      const gw=week.gamesWon||{red:0,white:0,blue:0};
      const cols=fmt.mode==='2x7'?[['red','#d92b2b'],['white','#4b5563']]:[['red','#d92b2b'],['white','#4b5563'],['blue','#1d4ed8']];
      const hasSaved=!!week.gamesWon;
      teamsHTML+=`<div class="card" style="border-top:3px solid ${hasSaved?'#16a34a':'var(--red)'};background:${hasSaved?'#f0fdf4':'#fffafa'};">
        <div style="display:flex;align-items:center;gap:9px;margin-bottom:4px;">
          <div style="width:9px;height:9px;border-radius:50%;background:${hasSaved?'#16a34a':'var(--red)'};flex-shrink:0;"></div>
          <div style="font-size:15px;font-weight:600;">${hasSaved?'Results recorded':'📋 Record game results'}</div>
          ${hasSaved?`<span style="font-size:12px;color:#16a34a;font-weight:500;margin-left:auto;">✓ Saved</span>`:'<span style="font-size:11px;color:var(--red);margin-left:auto;">Needed for leaderboard</span>'}
        </div>
        <div style="font-size:12px;color:var(--t2);margin-bottom:14px;">Enter games won by each team after the session.</div>
        <div class="${fmt.mode==='2x7'?'g2':'g3'}">${cols.map(([c,col])=>`<div><div style="display:flex;align-items:center;gap:5px;margin-bottom:7px;"><div style="width:9px;height:9px;border-radius:50%;background:${col};"></div><span style="font-size:10px;text-transform:uppercase;letter-spacing:.07em;color:var(--t2);font-weight:600;">${c} wins</span></div><input type="number" id="gw-${c}" min="0" max="99" value="${gw[c]||0}"></div>`).join('')}</div>
        <div style="display:flex;align-items:center;gap:10px;margin-top:14px;"><button class="btn btn-p bsm" onclick="saveGW('${week.date}')">Save results</button>${hasSaved?`<span style="font-size:12px;color:var(--t2);">Update anytime</span>`:''}</div>
      </div>`;
    }
  }
  return voterList+(teamsHTML||'')+subsHTML;
}

// ══════════════════════════════════════════════
//  RENDER
// ══════════════════════════════════════════════
function renderV(){
  const lh=document.getElementById('lh'),ln=document.getElementById('ln'),lc=document.getElementById('lc');
  if(!ST.user){
    lh.style.display='none';ln.style.display='none';
    lc.className='login-mode';lc.style.padding='0';
    lc.innerHTML=V_login();return;
  }
  const isAdmin=ST.user.role==='admin';
  lh.style.display='block';
  lh.innerHTML=`<div class="ahdr">
    <div class="ahdr-brand">
      <div class="ahdr-ico">${ballSVG(18,'rgba(255,255,255,.88)')}</div>
      <div><div class="ahdr-nm">LUES Soccer Club</div><div class="ahdr-rl">${isAdmin?'Administrator':'Member'}</div></div>
    </div>
    <button class="sout" onclick="doLogout()">Sign out</button>
  </div>`;

  const navItems=isAdmin
    ?[['ap','Players',iconPlayers],['aw','This Week',iconWeek],['ah','History',iconHistory],['am','Dashboard',iconDash]]
    :[['uh','Vote',iconVote],['uhist','History',iconHistory]];

  ln.style.display='block';
  ln.innerHTML=`<nav class="anav">${navItems.map(([id,lbl,iconFn])=>{
    const active=ST.view===id;
    return`<button class="atab${active?' on':''}" onclick="navTo('${id}')" style="position:relative;">
      <span class="tab-dot"></span>
      ${iconFn(active)}
      <span class="tab-lbl">${lbl}</span>
    </button>`;
  }).join('')}</nav>`;

  lc.className='';
  lc.style.padding='14px';
  lc.style.paddingBottom=`calc(var(--nav-h) + 14px + var(--safe-b))`;
  lc.innerHTML='';void lc.offsetWidth;lc.style.animation='fUp .22s ease';
  const views={ap:V_ap,aw:V_aw,ah:V_ah,am:V_am,uh:V_uh,uhist:V_uhist};
  lc.innerHTML=(views[ST.view]||V_login)();
}

// ══════════════════════════════════════════════
//  ACTIONS
// ══════════════════════════════════════════════
function doLogin(){
  const u=(document.getElementById('li-u')?.value||'').trim(),p=document.getElementById('li-p')?.value||'';
  if(u===ADMIN.u&&p===ADMIN.p){
    ST.user={role:'admin'};ST.view='aw';
    saveSession();
    renderV();
    showLoader('Welcome back, Admin',2100,null);
    setTimeout(()=>{const d=document.getElementById('lues-ldr');if(d){d.style.transition='opacity .4s ease';d.style.opacity='0';setTimeout(()=>d.remove(),420);}},2100);
    return;
  }
  if(u===USR.u&&p===USR.p){
    ST.user={role:'user'};ST.view='uh';
    saveSession();
    renderV();
    showLoader('Welcome, Member',2100,null);
    setTimeout(()=>{const d=document.getElementById('lues-ldr');if(d){d.style.transition='opacity .4s ease';d.style.opacity='0';setTimeout(()=>d.remove(),420);}},2100);
    return;
  }
  const e=document.getElementById('li-e');
  if(e){e.style.display='block';e.style.animation='none';void e.offsetWidth;e.style.animation='shake .35s ease';}
}

function doLogout(){
  ST.user=null;ST.view='login';ST.editId=null;ST.historyKey=null;pendingPhoto=null;
  clearSession();
  renderV();
  showLoader('Signing out...',1300,null);
  setTimeout(()=>{const d=document.getElementById('lues-ldr');if(d){d.style.transition='opacity .4s ease';d.style.opacity='0';setTimeout(()=>d.remove(),420);}},1300);
}

function navTo(v){
  ST.view=v;ST.historyKey=null;
  saveSession();
  renderV();
}

function viewHist(k){ST.historyKey=k;renderV();}
function goBack(){ST.historyKey=null;renderV();}
function startEdit(id){ST.editId=id;pendingPhoto=null;renderV();}
function cancelEdit(){ST.editId=null;pendingPhoto=null;renderV();}

function prevPhoto(input){
  const f=input.files[0];if(!f)return;if(f.size>2*1024*1024){alert('Max 2 MB.');return;}
  const r=new FileReader();r.onload=e=>{pendingPhoto=e.target.result;const av=document.getElementById('pf-av');if(av)av.innerHTML=`<img src="${pendingPhoto}" style="width:100%;height:100%;object-fit:cover;">`;};r.readAsDataURL(f);
}

async function savePl(editId){
  const name=(document.getElementById('pf-n')?.value||'').trim();if(!name){alert('Enter a name.');return;}
  const skills={};['speed','shooting','passing','defense','stamina'].forEach(k=>{skills[k]=parseInt(document.getElementById('pf-'+k)?.value||5);});
  const nationality=(document.getElementById('pf-nat')?.value||'')||null;
  if(editId==='__new__'){
    const id=uid();
    ST.players.push({id,name,skills,nationality,photo:pendingPhoto||null});
    if(pendingPhoto)await savePh(id,pendingPhoto);
  } else {
    const idx=ST.players.findIndex(p=>p.id===editId);
    if(idx>=0){
      ST.players[idx]={...ST.players[idx],name,skills,nationality};
      if(pendingPhoto){ST.players[idx].photo=pendingPhoto;await savePh(editId,pendingPhoto);}
    }
  }
  pendingPhoto=null;ST.editId=null;
  await SAVE();
  renderV();
}

async function delPl(id){
  if(!confirm('Delete this player?'))return;
  ST.players=ST.players.filter(p=>p.id!==id);
  // Remove photo from Firebase too
  try { await db.ref('lues/photos/'+id).remove(); } catch(e){}
  ST.editId=null;
  await SAVE();
  renderV();
}

async function userVote(){
  const name=(document.getElementById('uv-sel')?.value||'').trim();
  const msg=document.getElementById('uv-m');
  if(!name){if(msg)msg.innerHTML=`<span style="color:#fca5a5;">Please select your name.</span>`;return;}
  const fmt=getFmt();const key=todayKey();
  if(!ST.weeks[key])ST.weeks[key]={date:key,votes:[],locked:false,teams:null};
  const week=ST.weeks[key];
  if(week.locked||week.votes.length>=fmt.target){if(msg)msg.innerHTML=`<span style="color:#fca5a5;">Voting is closed.</span>`;return;}
  if(week.votes.some(v=>v.name.toLowerCase()===name.toLowerCase())){if(msg)msg.innerHTML=`<span style="color:#fde68a;">${escH(name)} is already checked in.</span>`;return;}
  week.votes.push({name,timestamp:new Date().toISOString()});
  if(week.votes.length>=fmt.target){week.locked=true;const r=genTeams(week.votes);week.teams=fmt.mode==='2x7'?{red:r.red,white:r.white,subs:r.subs}:{red:r.red,white:r.white,blue:r.blue,subs:r.subs};}
  await SAVE();
  renderV();
}

async function adminAV(weekDate){
  const name=(document.getElementById('av-sel')?.value||'').trim();if(!name)return;
  if(!ST.weeks[weekDate])ST.weeks[weekDate]={date:weekDate,votes:[],locked:false,teams:null};
  const week=ST.weeks[weekDate];const fmt=getFmt();
  if(week.votes.some(v=>v.name.toLowerCase()===name.toLowerCase())){alert(`${name} already checked in.`);return;}
  week.votes.push({name,timestamp:new Date().toISOString()});
  if(week.votes.length>=fmt.target&&!week.locked){week.locked=true;const r=genTeams(week.votes);week.teams=fmt.mode==='2x7'?{red:r.red,white:r.white,subs:r.subs}:{red:r.red,white:r.white,blue:r.blue,subs:r.subs};}
  await SAVE();
  renderV();
}

async function rmV(weekDate,idx){
  const week=ST.weeks[weekDate];if(!week)return;
  week.votes.splice(idx,1);
  await SAVE();
  renderV();
}

async function toggleLock(weekDate){
  if(!ST.weeks[weekDate])ST.weeks[weekDate]={date:weekDate,votes:[],locked:false,teams:null};
  ST.weeks[weekDate].locked=!ST.weeks[weekDate].locked;
  await SAVE();
  renderV();
}

async function doGenT(weekDate){
  const week=ST.weeks[weekDate];if(!week)return;
  const fmt=getFmt();const r=genTeams(week.votes);
  week.teams=fmt.mode==='2x7'?{red:r.red,white:r.white,subs:r.subs}:{red:r.red,white:r.white,blue:r.blue,subs:r.subs};
  await SAVE();
  renderV();
}

async function saveGW(weekDate){
  const week=ST.weeks[weekDate];if(!week)return;
  week.gamesWon={
    red:parseInt(document.getElementById('gw-red')?.value||0),
    white:parseInt(document.getElementById('gw-white')?.value||0),
    blue:parseInt(document.getElementById('gw-blue')?.value||0)
  };
  await SAVE();
  renderV();
}

// ══════════════════════════════════════════════
//  CLOCK & COUNTDOWN TICKER
// ══════════════════════════════════════════════
setInterval(()=>{
  const el=document.getElementById('abclock');if(el)el.textContent=nowClock();
  const cd=document.getElementById('vote-countdown');if(cd&&msUntilNextVote()>0)cd.textContent=fmtCountdown(msUntilNextVote());
},1000);

// ══════════════════════════════════════════════
//  BOOT
// ══════════════════════════════════════════════
(async function(){
  const MIN_MS=1800;const t0=Date.now();
  showLoader('Connecting to Firebase…',99999,null);
  await LOAD();
  const wait=Math.max(0,MIN_MS-(Date.now()-t0));
  setTimeout(()=>{
    const d=document.getElementById('lues-ldr');
    if(d){d.style.transition='opacity .4s ease';d.style.opacity='0';setTimeout(()=>{d.remove();renderV();},420);}
    else renderV();
  },wait);
})();
</script>
