<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d2545">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>LUES Soccer Club</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<style>
:root{
  --navy:#0d2545;--navy2:#1b3d6e;--navy3:#0a1e38;
  --red:#d92b2b;--red2:#b91c1c;
  --blue:#1d4ed8;--blue2:#1e3a8a;
  --green:#16a34a;--amber:#b45309;
  --bg:#eef2f7;--bg2:#f8fafc;--text:#111827;--t2:#6b7280;--t3:#9ca3af;
  --bdr:rgba(0,0,0,.07);
  --sh:0 1px 8px rgba(13,37,69,.08),0 4px 16px rgba(13,37,69,.06);
  --sh2:0 8px 32px rgba(13,37,69,.16);
  --r:16px;--r2:12px;
  --safe-t:env(safe-area-inset-top,0px);
  --safe-b:env(safe-area-inset-bottom,0px);
  --safe-l:env(safe-area-inset-left,0px);
  --safe-r:env(safe-area-inset-right,0px);
  --nav-h:72px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html{height:100%;-webkit-text-size-adjust:100%;}
body,#la{font-family:'DM Sans',-apple-system,sans-serif;color:var(--text);background:var(--bg);min-height:100%;overscroll-behavior:none;}
button,select,input,a{touch-action:manipulation;-webkit-tap-highlight-color:transparent;}
img{-webkit-user-drag:none;user-select:none;}

@keyframes fUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes fIn{from{opacity:0}to{opacity:1}}
@keyframes ldrIn{from{opacity:0}to{opacity:1}}
@keyframes ldotB{0%,80%,100%{opacity:.25;transform:translateY(0)}40%{opacity:1;transform:translateY(-6px)}}
@keyframes badgePulse{0%,100%{box-shadow:0 0 0 6px rgba(217,43,43,.18),0 20px 60px rgba(0,0,0,.4)}50%{box-shadow:0 0 0 18px rgba(217,43,43,.06),0 20px 60px rgba(0,0,0,.4)}}
@keyframes sheetUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
@keyframes slideUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
@keyframes tabPop{0%{transform:scale(1)}50%{transform:scale(1.18)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@keyframes clockPulse{0%,100%{opacity:1}50%{opacity:.55}}
@keyframes cdDigitFlip{0%{transform:translateY(-4px);opacity:0}100%{transform:translateY(0);opacity:1}}

/* ── LIVE CLOCK (header) ── */
.hdr-clock-wrap{display:flex;flex-direction:column;align-items:flex-end;gap:1px;margin-right:10px;}
.hdr-clock-time{font-family:'Barlow Condensed',Impact,sans-serif;font-size:18px;font-weight:700;letter-spacing:.08em;color:#fff;line-height:1;}
.hdr-clock-colon{animation:clockPulse 1s ease infinite;}
.hdr-clock-sub{font-size:9px;color:rgba(255,255,255,.32);text-transform:uppercase;letter-spacing:.14em;text-align:right;}

/* ── LIVE COUNTDOWN ── */
.cd-wrap{display:flex;align-items:center;justify-content:center;gap:6px;margin:6px 0 4px;}
.cd-seg{display:flex;flex-direction:column;align-items:center;gap:3px;}
.cd-val{font-family:'Barlow Condensed',Impact,sans-serif;font-size:32px;font-weight:700;letter-spacing:.04em;color:#fff;min-width:52px;text-align:center;background:rgba(255,255,255,.07);border-radius:10px;padding:6px 4px 4px;line-height:1;border:1px solid rgba(255,255,255,.1);}
.cd-lbl{font-size:8px;text-transform:uppercase;letter-spacing:.14em;color:rgba(255,255,255,.3);font-weight:500;}
.cd-sep{font-family:'Barlow Condensed',Impact,sans-serif;font-size:28px;font-weight:700;color:rgba(255,255,255,.3);margin-bottom:14px;animation:clockPulse 1s ease infinite;}
/* compact variant for login page */
.cd-val.sm{font-size:22px;min-width:38px;padding:4px 3px 3px;border-radius:8px;}

.lwrap{min-height:100svh;background:linear-gradient(155deg,#060e1c 0%,#0d2545 55%,#163260 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:calc(2rem + var(--safe-t)) 1.25rem calc(3rem + var(--safe-b));animation:fIn .5s ease;}
.lbadge{width:92px;height:92px;border-radius:50%;background:rgba(255,255,255,.06);border:2.5px solid var(--red);display:flex;align-items:center;justify-content:center;margin-bottom:16px;box-shadow:0 0 0 10px rgba(217,43,43,.1),0 20px 60px rgba(0,0,0,.4);animation:badgePulse 2s ease infinite;}
.ltitle{font-family:'Barlow Condensed',Impact,sans-serif;font-size:40px;font-weight:700;color:#fff;letter-spacing:.05em;margin-bottom:4px;}
.lsub{font-size:12px;color:rgba(255,255,255,.35);text-transform:uppercase;letter-spacing:.16em;margin-bottom:32px;}
.lcard{width:100%;max-width:420px;background:#fff;border-radius:24px;padding:28px 22px 24px;box-shadow:0 32px 80px rgba(0,0,0,.42);animation:slideUp .4s cubic-bezier(.32,0,.67,0) .1s both;}
.lcard h3{font-size:17px;font-weight:600;color:var(--text);margin-bottom:22px;}
.lf{margin-bottom:16px;}
.lf label{display:block;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.11em;color:var(--t2);margin-bottom:8px;}
.lf input{width:100%;padding:15px 16px;border:1.5px solid #e5e7eb;border-radius:13px;font-size:16px;font-family:'DM Sans',sans-serif;color:var(--text);outline:none;transition:border-color .2s,box-shadow .2s;-webkit-appearance:none;}
.lf input:focus{border-color:var(--navy);box-shadow:0 0 0 3px rgba(13,37,69,.08);}
.lerr{font-size:13px;color:var(--red);margin-bottom:12px;display:none;animation:shake .35s ease;}
.lbtn{width:100%;background:var(--navy);color:#fff;border:none;border-radius:14px;padding:17px;font-size:16px;font-weight:600;font-family:'DM Sans',sans-serif;cursor:pointer;transition:background .15s,transform .1s;min-height:56px;letter-spacing:.01em;}
.lbtn:active{background:var(--navy2);transform:scale(.98);}
.lhint{font-size:12px;color:var(--t3);text-align:center;margin-top:14px;}
.lvote-status{margin-top:22px;text-align:center;animation:slideUp .5s cubic-bezier(.32,0,.67,0) .25s both;}

/* ── LOGIN clock strip ── */
.login-clock-strip{display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:10px;padding:7px 14px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:30px;width:fit-content;margin-left:auto;margin-right:auto;}
.login-clock-dot{width:6px;height:6px;border-radius:50%;background:#4ade80;box-shadow:0 0 6px #4ade80;flex-shrink:0;animation:clockPulse 1.4s ease infinite;}
.login-clock-val{font-family:'Barlow Condensed',Impact,sans-serif;font-size:15px;font-weight:700;letter-spacing:.1em;color:rgba(255,255,255,.75);}
.login-clock-label{font-size:9px;color:rgba(255,255,255,.3);text-transform:uppercase;letter-spacing:.13em;}

.ahdr{position:sticky;top:0;z-index:200;background:var(--navy);padding:calc(10px + var(--safe-t)) 16px 10px;display:flex;align-items:center;justify-content:space-between;color:#fff;box-shadow:0 2px 16px rgba(0,0,0,.3);}
.ahdr-brand{display:flex;align-items:center;gap:10px;}
.ahdr-ico{width:38px;height:38px;border-radius:12px;background:rgba(255,255,255,.1);border:1.5px solid rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.ahdr-nm{font-family:'Barlow Condensed',Impact,sans-serif;font-size:19px;font-weight:700;letter-spacing:.04em;}
.ahdr-rl{font-size:10px;opacity:.45;margin-top:1px;letter-spacing:.05em;text-transform:uppercase;}
.ahdr-right{display:flex;align-items:center;gap:8px;}
.sout{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);color:#fff;padding:9px 16px;border-radius:10px;cursor:pointer;font-size:13px;font-family:'DM Sans',sans-serif;font-weight:500;min-height:40px;display:flex;align-items:center;transition:background .15s;}
.sout:active{background:rgba(255,255,255,.25);}

.anav{position:fixed;bottom:0;left:0;right:0;z-index:200;background:#fff;border-top:1px solid rgba(0,0,0,.08);display:flex;padding-bottom:var(--safe-b);box-shadow:0 -4px 20px rgba(13,37,69,.1);}
.atab{flex:1;padding:10px 4px 8px;border:none;background:transparent;font-family:'DM Sans',sans-serif;font-size:10px;font-weight:500;letter-spacing:.03em;color:var(--t3);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;transition:color .15s;min-height:calc(56px + var(--safe-b));-webkit-tap-highlight-color:transparent;}
.atab svg{transition:transform .2s cubic-bezier(.34,1.56,.64,1);}
.atab.on{color:var(--navy);}
.atab.on svg{transform:scale(1.15);}
.atab.on .tab-dot{display:block;}
.tab-dot{display:none;width:4px;height:4px;border-radius:50%;background:var(--red);position:absolute;top:7px;}
.tab-lbl{font-family:'Barlow Condensed',Impact,sans-serif;font-size:12px;font-weight:700;letter-spacing:.04em;}
.atab:active svg{animation:tabPop .25s ease;}

#lc{padding:14px;padding-bottom:calc(var(--nav-h) + 16px + var(--safe-b));animation:fUp .25s ease;}
#lc.login-mode{padding:0;padding-bottom:0;}

.card{background:#fff;border-radius:var(--r);padding:16px;margin-bottom:12px;box-shadow:var(--sh);}
.sec{background:#f4f7fb;border-radius:var(--r);padding:14px 16px;margin-bottom:12px;border:1px solid var(--bdr);}

.btn{padding:11px 17px;border-radius:12px;border:1.5px solid #e5e7eb;background:#fff;cursor:pointer;font-size:14px;font-weight:500;font-family:'DM Sans',sans-serif;color:var(--text);min-height:46px;display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:background .12s,transform .1s,box-shadow .12s;letter-spacing:.01em;}
.btn:active{background:#f3f4f6;transform:scale(.97);}
.btn-p{background:var(--navy)!important;color:#fff!important;border-color:var(--navy)!important;}
.btn-p:active{background:var(--navy2)!important;}
.btn-d{background:#fef2f2!important;color:#dc2626!important;border-color:#fca5a5!important;}
.btn-w{background:#fffbeb!important;color:#b45309!important;border-color:#fde68a!important;}
.bsm{padding:9px 13px!important;font-size:13px!important;min-height:40px!important;}

.badge{display:inline-flex;align-items:center;padding:4px 10px;border-radius:20px;font-size:12px;font-weight:500;}
.bs{background:#dcfce7;color:#15803d;}
.bd{background:#fee2e2;color:#dc2626;}
.bw{background:#fef3c7;color:#b45309;}

.fg{display:flex;flex-direction:column;margin-bottom:14px;}
.fg label{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.1em;color:var(--t2);margin-bottom:8px;}
.fg input,.fg select{width:100%;padding:14px 15px;border:1.5px solid #e5e7eb;border-radius:12px;font-size:16px;font-family:'DM Sans',sans-serif;color:var(--text);background:#fff;outline:none;transition:border-color .2s,box-shadow .2s;-webkit-appearance:none;appearance:none;min-height:52px;}
.fg select{appearance:auto;-webkit-appearance:auto;}
.fg input:focus,.fg select:focus{border-color:var(--navy);box-shadow:0 0 0 3px rgba(13,37,69,.07);}

.plcard{display:flex;align-items:flex-start;gap:12px;padding:15px;background:#fff;border-radius:var(--r);margin-bottom:10px;box-shadow:var(--sh);cursor:pointer;transition:transform .1s,box-shadow .1s;}
.plcard:active{transform:scale(.985);box-shadow:var(--sh2);}

.sb{display:flex;align-items:center;gap:7px;margin:4px 0;}
.sb-l{font-size:11px;color:var(--t3);width:56px;flex-shrink:0;}
.sb-t{flex:1;height:5px;background:#f3f4f6;border-radius:3px;overflow:hidden;}
.sb-f{height:100%;border-radius:3px;}
.sb-v{font-size:11px;color:var(--t3);width:16px;text-align:right;font-weight:500;}

.ovb{border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0;color:#fff;}
.og{background:linear-gradient(135deg,#22c55e,#16a34a);}
.ob{background:linear-gradient(135deg,#3b82f6,#1d4ed8);}
.oa{background:linear-gradient(135deg,#f59e0b,#d97706);}
.or{background:linear-gradient(135deg,#ef4444,#dc2626);}

.vrow{display:flex;justify-content:space-between;align-items:center;padding:11px 13px;background:#f8fafc;border-radius:11px;margin-bottom:7px;min-height:50px;transition:background .1s;cursor:pointer;}
.vrow:active{background:#f0f4f8;}
.vnum{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0;}

.tcard{border-radius:var(--r);padding:16px;margin-bottom:12px;border-left:4px solid;box-shadow:var(--sh);}
.tc-r{border-left-color:var(--red);background:#fffafa;}
.tc-w{border-left-color:#4b5563;background:#fff;}
.tc-b{border-left-color:var(--blue);background:#f8faff;}
.tc-s{border-left-color:#9ca3af;background:#f9fafb;}
.tc-g{border-left-color:#16a34a;background:#f0fdf4;}
.tc-hdr{display:flex;align-items:center;gap:9px;margin-bottom:13px;}
.tcdot{width:12px;height:12px;border-radius:50%;flex-shrink:0;}
.tc-nm{font-family:'Barlow Condensed',Impact,sans-serif;font-size:20px;font-weight:700;letter-spacing:.02em;}
.tc-avg{font-size:12px;color:var(--t2);margin-left:auto;font-weight:500;}

.prow{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid #f3f4f6;cursor:pointer;min-height:50px;transition:background .1s;}
.prow:last-child{border-bottom:none;}
.prow:active{background:#f9fafb;border-radius:10px;padding-left:8px;margin-left:-8px;}

.prog{height:7px;background:#e5e7eb;border-radius:4px;overflow:hidden;margin-bottom:16px;}
.prog-f{height:100%;background:linear-gradient(90deg,var(--navy),#2563eb);border-radius:4px;transition:width .5s cubic-bezier(.4,0,.2,1);}

.hrow{display:flex;justify-content:space-between;align-items:center;padding:16px;background:#fff;border-radius:var(--r);margin-bottom:9px;cursor:pointer;box-shadow:var(--sh);min-height:66px;transition:transform .1s,box-shadow .1s;}
.hrow:active{transform:scale(.985);box-shadow:var(--sh2);}

.wrow{display:flex;align-items:center;gap:13px;padding:14px 15px;background:#fff;border-radius:var(--r);margin-bottom:9px;box-shadow:var(--sh);min-height:62px;transition:transform .1s;cursor:pointer;}
.wrow:active{transform:scale(.985);}
.wrnk{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex-shrink:0;}
.r1{background:linear-gradient(135deg,#ffd700,#f59e0b);color:#7c3a00;}
.r2{background:linear-gradient(135deg,#e2e8f0,#cbd5e1);color:#334155;}
.r3{background:linear-gradient(135deg,#d97706,#92400e);color:#fff;}
.rn{background:#f3f4f6;color:var(--t2);}

.divider{height:1px;background:#f3f4f6;margin:16px 0;}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;}
.sec-title{font-family:'Barlow Condensed',Impact,sans-serif;font-size:24px;font-weight:700;letter-spacing:.02em;color:var(--navy);}
.empty-s{text-align:center;padding:3.5rem 1rem;color:var(--t2);font-size:14px;}
.wdate{font-family:'Barlow Condensed',Impact,sans-serif;font-size:21px;font-weight:700;color:var(--navy);letter-spacing:.02em;}

.sk-row{margin-bottom:14px;}
.sk-row label{display:flex;justify-content:space-between;font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--t2);margin-bottom:7px;font-weight:600;}
.sk-row input[type=range]{width:100%;accent-color:var(--navy);height:32px;cursor:pointer;}

input[type=number]{padding:13px;border:1.5px solid #e5e7eb;border-radius:12px;font-size:18px;font-family:'DM Sans',sans-serif;color:var(--text);outline:none;width:100%;text-align:center;min-height:54px;-webkit-appearance:none;font-weight:600;}
input[type=number]:focus{border-color:var(--navy);box-shadow:0 0 0 3px rgba(13,37,69,.07);}

.adv-row{display:flex;gap:9px;align-items:stretch;}
.adv-row select,.adv-row input{flex:1;padding:13px 14px;border:1.5px solid #e5e7eb;border-radius:12px;font-size:16px;font-family:'DM Sans',sans-serif;outline:none;background:#fff;color:var(--text);min-height:52px;transition:border-color .2s;}
.adv-row select:focus,.adv-row input:focus{border-color:var(--navy);}

.nosession{min-height:240px;background:linear-gradient(155deg,#060e1c,#0d2545);border-radius:var(--r);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2.5rem 1.5rem;margin-bottom:12px;color:#fff;text-align:center;box-shadow:var(--sh2);}
.ns-ico{width:58px;height:58px;border-radius:50%;background:rgba(255,255,255,.08);border:1.5px solid rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center;margin:0 auto 16px;}
.ns-title{font-family:'Barlow Condensed',Impact,sans-serif;font-size:26px;font-weight:700;letter-spacing:.04em;margin-bottom:7px;}
.ns-sub{font-size:13px;color:rgba(255,255,255,.4);margin-bottom:12px;}
.ns-clock{font-family:'Barlow Condensed',Impact,sans-serif;font-size:26px;font-weight:700;letter-spacing:.06em;color:rgba(255,255,255,.65);}

/* upcoming session card for user view */
.upcoming-card{background:#fff;border-radius:var(--r);padding:14px 16px;margin-bottom:9px;box-shadow:var(--sh);display:flex;align-items:center;justify-content:space-between;gap:10px;}
.upcoming-card.next-up{border:1.5px solid var(--blue);}

.sfmt{display:flex;align-items:center;gap:10px;padding:13px 15px;background:linear-gradient(90deg,#f0f4ff,#e8f0fe);border-radius:14px;margin-bottom:12px;border:1px solid #c7d7fe;flex-wrap:wrap;}
.sfmt-lbl{font-size:13px;font-weight:500;color:var(--navy2);flex:1;min-width:120px;}
.fmt-pill{display:inline-flex;background:#e0e8ff;border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap;}
.fmt-opt{padding:9px 14px;border-radius:8px;border:none;cursor:pointer;font-size:13px;font-weight:700;font-family:'Barlow Condensed',Impact,sans-serif;letter-spacing:.04em;color:var(--t2);background:transparent;transition:all .15s;min-height:38px;}
.fmt-opt.on{background:var(--navy);color:#fff;box-shadow:0 2px 8px rgba(13,37,69,.25);}
.fmt-opt:active{opacity:.85;}

select.vote-sel{width:100%;padding:14px 15px;border:1.5px solid #e5e7eb;border-radius:13px;font-size:16px;font-family:'DM Sans',sans-serif;color:var(--text);background:#fff;outline:none;transition:border-color .2s;min-height:54px;}
select.vote-sel:focus{border-color:var(--navy);}

.cta-card{background:linear-gradient(135deg,var(--navy),var(--navy2));border-radius:var(--r);padding:18px;margin-bottom:12px;box-shadow:0 8px 24px rgba(13,37,69,.3);color:#fff;}
.cta-card .cta-title{font-family:'Barlow Condensed',Impact,sans-serif;font-size:20px;font-weight:700;letter-spacing:.03em;margin-bottom:4px;}
.cta-card .cta-sub{font-size:12px;color:rgba(255,255,255,.55);margin-bottom:14px;}

.prof-back{position:fixed;inset:0;z-index:2000;background:rgba(0,0,0,.6);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);display:flex;align-items:flex-end;justify-content:center;animation:fIn .2s ease;}
.prof-card{background:#fff;border-radius:24px 24px 0 0;width:100%;max-width:500px;box-shadow:0 -12px 50px rgba(0,0,0,.3);animation:sheetUp .35s cubic-bezier(.32,0,.67,0);overflow:hidden;max-height:88svh;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:var(--safe-b);}
.prof-handle{width:36px;height:4px;border-radius:2px;background:rgba(0,0,0,.12);margin:10px auto 0;}
.prof-hdr{background:linear-gradient(135deg,#060e1c,#0d2545);padding:20px 22px 24px;text-align:center;position:relative;}
.prof-close{position:absolute;top:14px;right:14px;background:rgba(255,255,255,.14);border:none;color:rgba(255,255,255,.8);width:36px;height:36px;border-radius:50%;cursor:pointer;font-size:20px;display:flex;align-items:center;justify-content:center;font-family:'DM Sans',sans-serif;transition:background .15s;}
.prof-close:active{background:rgba(255,255,255,.28);}
.prof-body{padding:20px 22px 8px;}
.stat-box{display:flex;gap:10px;}
.stat-item{flex:1;background:#f4f7fb;border-radius:14px;padding:16px 8px;text-align:center;}
.stat-val{font-family:'Barlow Condensed',Impact,sans-serif;font-size:30px;font-weight:700;color:var(--navy);}

function getAB(){return new Date(new Date().toLocaleString('en-US',{timeZone:'America/Vancouver'}));}
function todayKey(){const t=getAB();return`${t.getFullYear()}-${String(t.getMonth()+1).padStart(2,'0')}-${String(t.getDate()).padStart(2,'0')}`;}
function fmtT(iso){return new Date(iso).toLocaleTimeString('en-US',{timeZone:'America/Vancouver',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:true});}
function fmtD(k){return new Date(k+'T12:00:00').toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric'});}
function nowClock(){return new Date().toLocaleTimeString('en-US',{timeZone:'America/Vancouver',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:true});}

// Returns {h12, min, sec, ampm} parts for styled clock
function nowClockParts(){
  const ab=getAB();
  const h=ab.getHours(),m=ab.getMinutes(),s=ab.getSeconds();
  const ap=h>=12?'PM':'AM';const h12=h%12||12;
  return{h12:String(h12).padStart(2,'0'),min:String(m).padStart(2,'0'),sec:String(s).padStart(2,'0'),ampm:ap};
}

function t2m(t){if(!t)return 0;const[h,m]=t.split(':').map(Number);return h*60+m;}
function fmtTime12(t){if(!t)return'';const[h,m]=t.split(':').map(Number);const ap=h>=12?'PM':'AM';const h12=h%12||12;return`${h12}:${String(m).padStart(2,'0')} ${ap}`;}

function sessionOpenMins(w){return t2m(w.openTime||'09:30');}
function sessionCloseMins(w){return t2m(w.closeTime||'19:00');}

function isSessionOpen(w){
  if(!w||w.locked)return false;
  if(w.date!==todayKey())return false;
  const ab=getAB();const nowM=ab.getHours()*60+ab.getMinutes();
  return nowM>=sessionOpenMins(w)&&nowM<sessionCloseMins(w);
}

function getNextSessionInfo(){
  const todayK=todayKey();
  const ab=getAB();
  const nowM=ab.getHours()*60+ab.getMinutes();
  const nowS=ab.getSeconds();
  const sessions=Object.values(ST.weeks)
    .filter(w=>w.date>=todayK)
    .sort((a,b)=>a.date.localeCompare(b.date));
  for(const w of sessions){
    const openM=sessionOpenMins(w);
    const closeM=sessionCloseMins(w);
    if(w.date===todayK){
      if(!w.locked&&nowM>=openM&&nowM<closeM)return{session:w,isOpen:true,ms:0};
      if(nowM<openM){const ms=Math.max(0,(openM-nowM)*60000-nowS*1000);return{session:w,isOpen:false,ms};}
      continue;
    } else {
      const[ty,tm,td]=todayK.split('-').map(Number);
      const[wy,wm,wd]=w.date.split('-').map(Number);
      const daysDiff=Math.round((new Date(wy,wm-1,wd)-new Date(ty,tm-1,td))/86400000);
      const secsNow=nowM*60+nowS;
      const secsOpen=openM*60;
      const ms=Math.max(0,daysDiff*86400000+(secsOpen-secsNow)*1000);
      return{session:w,isOpen:false,ms};
    }
  }
  return null;
}

// Returns structured countdown segments for pretty display
function cdParts(ms){
  if(ms===0)return null;
  const tot=Math.floor(ms/1000);
  const d=Math.floor(tot/86400),h=Math.floor((tot%86400)/3600),m=Math.floor((tot%3600)/60),s=tot%60;
  return{d,h:String(h).padStart(2,'0'),m:String(m).padStart(2,'0'),s:String(s).padStart(2,'0'),hasDays:d>0};
}

function fmtCountdown(ms){
  if(ms===0)return'OPEN NOW';
  const p=cdParts(ms);if(!p)return'--';
  return p.hasDays?`${p.d}d ${p.h}:${p.m}:${p.s}`:`${p.h}:${p.m}:${p.s}`;
}

// Renders a pretty segmented countdown HTML  (sm=true → smaller)
function cdHTML(ms,sm){
  if(ms===0)return`<div style="font-family:'Barlow Condensed',Impact,sans-serif;font-size:${sm?20:26}px;font-weight:700;color:#4ade80;letter-spacing:.04em;">⚽ OPEN NOW</div>`;
  const p=cdParts(ms);if(!p)return'';
  const cls='cd-val'+(sm?' sm':'');
  let segs='';
  if(p.hasDays){
    segs+=`<div class="cd-seg"><div class="${cls}" id="cd-d">${p.d}</div><div class="cd-lbl">Days</div></div><div class="cd-sep">:</div>`;
  }
  segs+=`<div class="cd-seg"><div class="${cls}" id="cd-h">${p.h}</div><div class="cd-lbl">Hrs</div></div>
    <div class="cd-sep">:</div>
    <div class="cd-seg"><div class="${cls}" id="cd-m">${p.m}</div><div class="cd-lbl">Min</div></div>
    <div class="cd-sep">:</div>
    <div class="cd-seg"><div class="${cls}" id="cd-s">${p.s}</div><div class="cd-lbl">Sec</div></div>`;
  return`<div class="cd-wrap">${segs}</div>`;
}

function sBars(sk){
  if(!sk)return'<div style="font-size:12px;color:var(--t2);padding:4px 0;">No skill data in roster.</div>';
  const skm={...sk};if(skm.defense&&!skm.defending)skm.defending=skm.defense;
  return[['Speed','speed'],['Stamina','stamina'],['Defending','defending'],['Attack','attack']].map(([l,k])=>{
    const v=Math.min(5,skm[k]||3);
    return`<div class="sb"><span class="sb-l">${l}</span><div class="sb-t"><div class="sb-f" style="width:${v*20}%;background:${sCol(v)};"></div></div><span class="sb-v">${v}</span></div>`;
  }).join('');
}

function playerStats(name){
  let won=0,played=0;
  Object.values(ST.weeks).forEach(w=>{
    if(!w.votes)return;
    if(!w.votes.some(v=>v.name.toLowerCase()===name.toLowerCase()))return;
    played++;
    if(!w.teams||!w.gamesWon)return;
    ['red','white','blue'].forEach(c=>{if((w.teams[c]||[]).some(p=>p.name.toLowerCase()===name.toLowerCase()))won+=(w.gamesWon[c]||0);});
  });
  return{won,played};
}

// ══════════════════════════════════════════════
function genTeams(votes){
  const fmt=getFmt();const T=fmt.target,nT=fmt.teams;
  const first=votes.slice(0,T).map(v=>{
    const pl=ST.players.find(p=>p.name.toLowerCase()===v.name.toLowerCase());
    return{name:v.name,timestamp:v.timestamp,skills:pl&&pl.skills?pl.skills:null,photo:pl?pl.photo||null:null,overall:pl?sAvg(pl.skills):3};
  });
  const subs=votes.slice(T).map(v=>({name:v.name,timestamp:v.timestamp}));
  if(fmt.mode==='dropin')return{red:first,subs};
  first.sort((a,b)=>b.overall-a.overall);
  const teams=Array.from({length:nT},()=>[]);
  for(let i=0;i<first.length;i++){const round=Math.floor(i/nT),pos=i%nT,ti=round%2===0?pos:(nT-1-pos);teams[ti].push(first[i]);}
  if(nT===3)return{red:teams[0],white:teams[1],blue:teams[2],subs};
  return{red:teams[0],white:teams[1],subs};
}
function buildTeamsObj(r,fmt){
  if(fmt.mode==='dropin')return{red:r.red,subs:r.subs};
  if(fmt.mode==='3x5')return{red:r.red,white:r.white,blue:r.blue,subs:r.subs};
  return{red:r.red,white:r.white,subs:r.subs};
}

async function setFmt(mode){
  const formats={
    '2x4':{mode:'2x4',perTeam:4,teams:2,target:8},
    '2x5':{mode:'2x5',perTeam:5,teams:2,target:10},
    '2x6':{mode:'2x6',perTeam:6,teams:2,target:12},
    '2x7':{mode:'2x7',perTeam:7,teams:2,target:14},
    '2x8':{mode:'2x8',perTeam:8,teams:2,target:16},
    '3x5':{mode:'3x5',perTeam:5,teams:3,target:15},
    'dropin':{mode:'dropin',perTeam:ST.fmt.dropinCount||8,teams:1,target:ST.fmt.dropinCount||8}
  };
  const base=formats[mode]||formats['3x5'];
  ST.fmt={...base,dropinCount:ST.fmt.dropinCount||8};
  await SAVE();renderV();
}
function setDropinCount(n){n=Math.max(1,Math.min(30,parseInt(n)||8));ST.fmt={...ST.fmt,perTeam:n,target:n,dropinCount:n};}

  if(!ST.monthFilter)ST.monthFilter=curM;
  const months=[...new Set(Object.keys(ST.weeks).map(k=>k.slice(0,7)))].sort((a,b)=>b.localeCompare(a));
  if(months.length&&!months.includes(ST.monthFilter))ST.monthFilter=months[0];
  const winners=mWinners(ST.monthFilter);
  const mLabel=new Date(ST.monthFilter+'-15').toLocaleString('en-US',{month:'long',year:'numeric'});
  return`<div style="display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap;">
    <div class="sec-title">Leaderboard</div>
    <select onchange="ST.monthFilter=this.value;renderV()" style="font-size:14px;padding:8px 11px;border:1.5px solid #e5e7eb;border-radius:10px;font-family:'DM Sans',sans-serif;color:var(--text);background:#fff;outline:none;min-height:42px;">
      ${months.length?months.map(m=>`<option value="${m}"${m===ST.monthFilter?' selected':''}>${new Date(m+'-15').toLocaleString('en-US',{month:'long',year:'numeric'})}</option>`).join(''):`<option value="${curM}">${mLabel}</option>`}
    </select></div>
  ${!winners.length?`<div class="empty-s">${ballSVG(42,'#9ca3af')}<div style="margin-top:14px;">No results for ${mLabel} yet.</div></div>`
    :winners.map((w,i)=>{const pl=ST.players.find(p=>p.name.toLowerCase()===w.name.toLowerCase());const ctry=pl&&pl.nationality?COUNTRIES.find(c=>c.n===pl.nationality):null;
      return`<div class="wrow" onclick="showProfile('${escH(w.name)}')">
        <div class="wrnk ${i===0?'r1':i===1?'r2':i===2?'r3':'rn'}">${i+1}</div>
        ${avH(w.name,pl?pl.photo:null,36)}
        <div style="flex:1;min-width:0;"><div style="font-size:14px;font-weight:500;">${escH(w.name)} ${ctry?ctry.f:''}</div><div style="font-size:12px;color:var(--t2);margin-top:2px;">${w.wins} win${w.wins!==1?'s':''}</div></div>
        ${i<3?`<div style="font-size:20px;">${i===0?'🥇':i===1?'🥈':'🥉'}</div>`:''}
      </div>`;}).join('')}`;
}
function mWinners(prefix){
  const wins={};
  Object.entries(ST.weeks).forEach(([k,w])=>{if(!k.startsWith(prefix)||!w.teams||!w.gamesWon)return;['red','white','blue'].forEach(c=>{const g=w.gamesWon[c]||0;if(g>0)(w.teams[c]||[]).forEach(p=>{wins[p.name]=(wins[p.name]||0)+g;});});});
  return Object.entries(wins).map(([name,wins])=>({name,wins})).sort((a,b)=>b.wins-a.wins);
}

function V_uh(){
  const todayK=todayKey();
  const ab=getAB();
  const nowM=ab.getHours()*60+ab.getMinutes();
  const fmt=getFmt();

  const todayWeek=ST.weeks[todayK];
  let activeSession=null;
  if(todayWeek){
    const openM=sessionOpenMins(todayWeek);
    const closeM=sessionCloseMins(todayWeek);
    const withinWindow=nowM>=openM&&nowM<closeM;
    if(withinWindow||todayWeek.locked)activeSession=todayWeek;
  }

  const futureSessions=Object.values(ST.weeks)
    .filter(w=>w.date>todayK)
    .sort((a,b)=>a.date.localeCompare(b.date));

  const info=getNextSessionInfo();
  let html='';

  if(activeSession){
    const isLocked=activeSession.locked;
    const vCount=(activeSession.votes||[]).length;
    const isOpenForVoting=!isLocked&&nowM>=sessionOpenMins(activeSession)&&nowM<sessionCloseMins(activeSession)&&vCount<fmt.target;
    const checkedIn=(activeSession.votes||[]).map(v=>v.name.toLowerCase());
    const available=ST.players.filter(p=>!checkedIn.includes(p.name.toLowerCase()));
    const modeLbl={'2x4':'2 teams of 4','2x5':'2 teams of 5','2x6':'2 teams of 6','2x7':'2 teams of 7','2x8':'2 teams of 8','3x5':'3 teams of 5','dropin':`Drop-in (${fmt.target})`}[fmt.mode]||'Teams';

    if(isOpenForVoting){
      html+=`<div class="cta-card">
        <div class="cta-title">⚽ Check in for today</div>
        <div class="cta-sub">Format: ${modeLbl} · Locks at ${fmt.target} players · Closes ${fmtTime12(activeSession.closeTime||'19:00')}</div>
        <div class="adv-row" style="margin-bottom:6px;">
          <select id="uv-sel" class="vote-sel" style="background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.2);color:#fff;">
            <option value="" style="color:var(--text);background:#fff;">— Select your name —</option>
            ${available.map(p=>{const ctry=p.nationality?COUNTRIES.find(c=>c.n===p.nationality):null;return`<option value="${escH(p.name)}" style="color:var(--text);background:#fff;">${ctry?ctry.f+' ':''} ${escH(p.name)}</option>`;}).join('')}
            ${available.length===0?`<option disabled style="color:var(--text);background:#fff;">All roster members checked in</option>`:''}
          </select>
          <button class="btn btn-p bsm" onclick="userVote()" style="background:var(--red)!important;border-color:var(--red)!important;white-space:nowrap;min-width:90px;">Check in</button>
        </div>
        <div id="uv-m" style="font-size:12px;min-height:16px;color:rgba(255,255,255,.7);"></div>
      </div>`;
    } else {
      html+=`<div class="sec" style="text-align:center;padding:12px;margin-bottom:12px;">
        <span class="badge bd" style="font-size:13px;">${isLocked?`⚽ Voting closed — ${vCount}/${fmt.target} registered`:`Check-in closed for today`}</span>
      </div>`;
    }
    html+=weekHTML(activeSession,false);

  } else {
    if(!todayWeek){
      html+=noSess('No Session Today','No session is scheduled for today. Check the upcoming schedule below!');
    } else {
      const openM=sessionOpenMins(todayWeek);
      const closeM=sessionCloseMins(todayWeek);
      if(nowM<openM){
        html+=noSess('Opens Soon',`Voting opens at ${fmtTime12(todayWeek.openTime||'09:30')} Alberta time today.`);
      } else {
        html+=noSess('Voting Closed',`Check-in closed at ${fmtTime12(todayWeek.closeTime||'19:00')}. See you next time!`);
      }
    }
  }

  if(futureSessions.length>0){
    html+=`<div style="display:flex;align-items:center;justify-content:space-between;margin:18px 0 10px;">
      <div class="sec-title">Upcoming Sessions</div>
      ${info&&!info.isOpen&&futureSessions.some(w=>w.date===info.session.date)
        ?`<div style="font-size:11px;color:var(--t2);">Next opens in <span id="user-cd" style="font-family:'Barlow Condensed',Impact,sans-serif;font-size:13px;font-weight:700;color:var(--navy);">${fmtCountdown(info.ms)}</span></div>`
        :''}
    </div>`;
    futureSessions.forEach(w=>{
      const isNext=info&&info.session.date===w.date;
      html+=`<div class="upcoming-card${isNext?' next-up':''}">
        <div style="flex:1;min-width:0;">
          <div style="font-size:14px;font-weight:500;margin-bottom:4px;">${fmtD(w.date)}</div>
          <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
            <span style="font-size:12px;color:var(--t2);">⏰ ${fmtTime12(w.openTime||'09:30')} – ${fmtTime12(w.closeTime||'19:00')}</span>
            <span style="font-size:11px;color:var(--t3);">· Alberta time</span>
          </div>
          ${isNext?`<div style="margin-top:6px;font-size:11px;color:var(--blue);font-weight:600;">⚡ Next up · Quota closes early if ${fmt.target} players check in</div>`:''}
        </div>
        <div style="text-align:right;flex-shrink:0;">
          <div style="font-family:'Barlow Condensed',Impact,sans-serif;font-size:15px;font-weight:700;color:var(--navy2);">${(w.votes||[]).length}/${fmt.target}</div>
          <div style="font-size:10px;color:var(--t3);">checked in</div>
        </div>
      </div>`;
    });
  }

  return html;
}

// ── WEEK HTML ──
function weekHTML(week,isAdmin){
  if(!week)return'';
  const fmt=getFmt();const votes=week.votes||[],isLocked=week.locked,vCount=votes.length,hasTeams=!!week.teams;
  const pct=Math.min(100,Math.round(vCount/fmt.target*100));const quotaReached=vCount>=fmt.target||isLocked;
  const checkedIn=(week.votes||[]).map(v=>v.name.toLowerCase());

  const timeRow=isAdmin?`<div style="display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap;padding:10px 12px;background:#f4f7fb;border-radius:11px;">
    <span style="font-size:11px;color:var(--t2);font-weight:600;text-transform:uppercase;letter-spacing:.07em;flex-shrink:0;">Voting window:</span>
    <input type="time" id="wt-open-${week.date}" value="${week.openTime||'09:30'}" class="ti" style="flex:1;min-width:80px;">
    <span style="font-size:11px;color:var(--t2);">–</span>
    <input type="time" id="wt-close-${week.date}" value="${week.closeTime||'19:00'}" class="ti" style="flex:1;min-width:80px;">
    <button class="btn bsm" onclick="updateSessionTimes('${week.date}')" style="flex-shrink:0;font-size:12px!important;">Update</button>
  </div>`:'';

  const voterList=`<div class="card" style="margin-bottom:12px;">
    <div style="display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:12px;flex-wrap:wrap;gap:8px;">
      <div>
        <div class="wdate" style="margin-bottom:6px;">${fmtD(week.date)}</div>
        <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
          <span style="font-size:13px;color:var(--t2);font-weight:500;">${vCount}/${fmt.target}</span>
          ${isLocked?`<span class="badge bd">Locked</span>`:`<span class="badge bs">Open</span>`}
          <span style="font-size:11px;color:var(--t3);">${fmtLabel(fmt)}</span>
          ${!isAdmin?`<span style="font-size:11px;color:var(--t3);">· ${fmtTime12(week.openTime||'09:30')}–${fmtTime12(week.closeTime||'19:00')}</span>`:''}
        </div>
      </div>
      ${isAdmin?`<div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center;">
        <button class="btn bsm ${isLocked?'btn-w':'btn-d'}" onclick="toggleLock('${week.date}')">${isLocked?'Unlock':'Lock'}</button>
        ${quotaReached?`<button class="btn bsm btn-p" onclick="doGenT('${week.date}')">${hasTeams?'Regen':'Gen teams'}</button>`:''}</div>`:''}
    </div>
    ${timeRow}
    <div class="prog"><div class="prog-f" style="width:${pct}%;"></div></div>
    ${votes.length===0?`<div style="font-size:13px;color:var(--t2);text-align:center;padding:14px 0;">No players registered yet.</div>`:''}
    ${votes.map((v,i)=>{
      const pl=ST.players.find(p=>p.name.toLowerCase()===v.name.toLowerCase());
      const ctry=pl&&pl.nationality?COUNTRIES.find(c=>c.n===pl.nationality):null;
      const main=i<fmt.target;
      return`<div class="vrow" onclick="showProfile('${escH(v.name)}')">
        <div style="display:flex;align-items:center;gap:9px;">
          <div class="vnum" style="background:${main?'var(--navy)':'#9ca3af'};color:white;">${i+1}</div>
          ${pl&&pl.photo?`<div style="width:24px;height:24px;border-radius:50%;overflow:hidden;flex-shrink:0;"><img src="${pl.photo}" style="width:100%;height:100%;object-fit:cover;"></div>`:''}
          <span style="font-size:13px;font-weight:${main?500:400};">${escH(v.name)} ${ctry?ctry.f:''}</span>
          ${!main?`<span class="badge bw" style="font-size:10px;padding:2px 7px;">Sub</span>`:''}
          ${!pl?`<span class="badge" style="background:#fef3c7;color:#92400e;font-size:10px;padding:2px 6px;">Not in roster</span>`:''}
        </div>
        <div style="display:flex;align-items:center;gap:6px;">
          <span style="font-size:10px;color:var(--t3);">${fmtT(v.timestamp)}</span>
          ${isAdmin?`<button class="btn bsm btn-d" onclick="event.stopPropagation();rmV('${week.date}',${i})" style="padding:4px 9px!important;font-size:12px!important;min-height:34px!important;">×</button>`:''}
        </div>
      </div>`;
    }).join('')}
    ${isAdmin&&!isLocked?`<div class="divider"></div>
      <div style="font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.09em;color:var(--t2);margin-bottom:9px;">Add manually</div>
      <div class="adv-row">
        <select id="av-sel" style="flex:1;padding:12px 14px;border:1.5px solid #e5e7eb;border-radius:11px;font-size:15px;font-family:'DM Sans',sans-serif;outline:none;background:#fff;color:var(--text);min-height:50px;">
          <option value="">— Select player —</option>
          ${ST.players.filter(p=>!checkedIn.includes(p.name.toLowerCase())).map(p=>{const ctry=p.nationality?COUNTRIES.find(c=>c.n===p.nationality):null;return`<option value="${escH(p.name)}">${ctry?ctry.f+' ':''} ${escH(p.name)}</option>`;}).join('')}

  let subsHTML='';
  if(quotaReached){
    const subsData=hasTeams&&week.teams&&week.teams.subs?week.teams.subs:votes.slice(fmt.target).map(v=>({name:v.name,timestamp:v.timestamp}));

      <div class="tc-hdr"><div class="tcdot" style="background:#9ca3af;"></div><span class="tc-nm" style="color:var(--t2);">Substitutes (${subsData.length})</span></div>
      ${subsData.length===0?`<div style="font-size:13px;color:var(--t2);">No subs this session.</div>`:subsData.map(s=>`<div class="prow" onclick="showProfile('${escH(s.name)}')">${avH(s.name,null,28)}<span style="font-size:13px;flex:1;">${escH(s.name)}</span><span style="font-size:10px;color:var(--t3);">${fmtT(s.timestamp)}</span></div>`).join('')}
    </div>`;
  }

  let teamsHTML='';
  if(hasTeams&&week.teams){
    const t=week.teams;teamsHTML=`<div class="sec-title" style="margin-bottom:10px;">Teams</div>`;
    let defs;
    if(fmt.mode==='3x5')defs=[{k:'red',lbl:'Red Team',cls:'tc-r',dot:'#d92b2b'},{k:'white',lbl:'White Team',cls:'tc-w',dot:'#4b5563'},{k:'blue',lbl:'Blue Team',cls:'tc-b',dot:'#1d4ed8'}];
    else if(fmt.mode==='dropin')defs=[{k:'red',lbl:'Drop-in Team',cls:'tc-g',dot:'#16a34a'}];
    else defs=[{k:'red',lbl:'Red Team',cls:'tc-r',dot:'#d92b2b'},{k:'white',lbl:'White Team',cls:'tc-w',dot:'#4b5563'}];

    defs.forEach(d=>{
      const players=t[d.k]||[];const avg=players.length?Math.min(5,Math.round(players.reduce((s,p)=>s+p.overall,0)/players.length)):0;
      teamsHTML+=`<div class="tcard ${d.cls}"><div class="tc-hdr"><div class="tcdot" style="background:${d.dot};"></div><span class="tc-nm">${d.lbl}</span><span class="tc-avg">Avg ${avg}/5</span></div>
        ${players.map(p=>{const rp=ST.players.find(r=>r.name.toLowerCase()===p.name.toLowerCase());const ctry=rp&&rp.nationality?COUNTRIES.find(c=>c.n===rp.nationality):null;return`<div class="prow" onclick="showProfile('${escH(p.name)}')">${avH(p.name,(rp&&rp.photo)||p.photo,32)}<span style="font-size:13px;font-weight:500;flex:1;">${escH(p.name)} ${ctry?ctry.f:''}</span><div class="ovb ${ovCls(p.overall)}" style="width:28px;height:28px;font-size:11px;">${p.overall}</div></div>`;}).join('')}
      </div>`;
    });

    if(isAdmin&&fmt.mode!=='dropin'){
      const gw=week.gamesWon||{red:0,white:0,blue:0};
      const cols=fmt.mode==='3x5'?[['red','#d92b2b'],['white','#4b5563'],['blue','#1d4ed8']]:[['red','#d92b2b'],['white','#4b5563']];
      const gridCls=fmt.mode==='3x5'?'g3':'g2';const hasSaved=!!week.gamesWon;
      teamsHTML+=`<div class="card" style="border-top:3px solid ${hasSaved?'#16a34a':'var(--red)'};background:${hasSaved?'#f0fdf4':'#fffafa'};">
        <div style="display:flex;align-items:center;gap:9px;margin-bottom:4px;">
          <div style="width:9px;height:9px;border-radius:50%;background:${hasSaved?'#16a34a':'var(--red)'};flex-shrink:0;"></div>
          <div style="font-size:15px;font-weight:600;">${hasSaved?'Results recorded':'📋 Record game results'}</div>
          ${hasSaved?`<span style="font-size:12px;color:#16a34a;font-weight:500;margin-left:auto;">✓ Saved</span>`:'<span style="font-size:11px;color:var(--red);margin-left:auto;">Needed for leaderboard</span>'}
        </div>
        <div style="font-size:12px;color:var(--t2);margin-bottom:14px;">Enter games won by each team after the session.</div>
        <div class="${gridCls}">${cols.map(([c,col])=>`<div><div style="display:flex;align-items:center;gap:5px;margin-bottom:7px;"><div style="width:9px;height:9px;border-radius:50%;background:${col};"></div><span style="font-size:10px;text-transform:uppercase;letter-spacing:.07em;color:var(--t2);font-weight:600;">${c} wins</span></div><input type="number" id="gw-${c}" min="0" max="99" value="${gw[c]||0}"></div>`).join('')}</div>
        <div style="display:flex;align-items:center;gap:10px;margin-top:14px;"><button class="btn btn-p bsm" onclick="saveGW('${week.date}')">Save results</button>${hasSaved?`<span style="font-size:12px;color:var(--t2);">Update anytime</span>`:''}</div>
      </div>`;
    }
  }
  return voterList+(teamsHTML||'')+subsHTML;
}

  ln.innerHTML=`<nav class="anav">${navItems.map(([id,lbl,iconFn])=>{
    const active=ST.view===id;
    return`<button class="atab${active?' on':''}" onclick="navTo('${id}')" style="position:relative;"><span class="tab-dot"></span>${iconFn(active)}<span class="tab-lbl">${lbl}</span></button>`;
  }).join('')}</nav>`;

  lc.className='';lc.style.padding='14px';lc.style.paddingBottom=`calc(var(--nav-h) + 14px + var(--safe-b))`;
  lc.innerHTML='';void lc.offsetWidth;lc.style.animation='fUp .22s ease';
  const views={ap:V_ap,aw:V_aw,ah:V_ah,am:V_am,uh:V_uh,uhist:V_uhist};
  lc.innerHTML=(views[ST.view]||V_login)();
}

// ══════════════════════════════════════════════
//  ACTIONS
// ══════════════════════════════════════════════
function doLogin(){
  const u=(document.getElementById('li-u')?.value||'').trim(),p=document.getElementById('li-p')?.value||'';
  if(u===ADMIN.u&&p===ADMIN.p){ST.user={role:'admin'};ST.view='aw';saveSession();renderV();showLoader('Welcome back, Admin',2100,null);setTimeout(()=>{const d=document.getElementById('lues-ldr');if(d){d.style.transition='opacity .4s ease';d.style.opacity='0';setTimeout(()=>d.remove(),420);}},2100);return;}
  if(u===USR.u&&p===USR.p){ST.user={role:'user'};ST.view='uh';saveSession();renderV();showLoader('Welcome, Member',2100,null);setTimeout(()=>{const d=document.getElementById('lues-ldr');if(d){d.style.transition='opacity .4s ease';d.style.opacity='0';setTimeout(()=>d.remove(),420);}},2100);return;}
  const e=document.getElementById('li-e');if(e){e.style.display='block';e.style.animation='none';void e.offsetWidth;e.style.animation='shake .35s ease';}
}
function doLogout(){ST.user=null;ST.view='login';ST.editId=null;ST.historyKey=null;ST.selectedDate=null;ST.schedulingNew=false;pendingPhoto=null;clearSession();renderV();showLoader('Signing out...',1300,null);setTimeout(()=>{const d=document.getElementById('lues-ldr');if(d){d.style.transition='opacity .4s ease';d.style.opacity='0';setTimeout(()=>d.remove(),420);}},1300);}
function navTo(v){ST.view=v;ST.historyKey=null;ST.selectedDate=null;ST.schedulingNew=false;saveSession();renderV();}
function viewHist(k){ST.historyKey=k;renderV();}
function goBack(){ST.historyKey=null;renderV();}
function startEdit(id){ST.editId=id;pendingPhoto=null;renderV();}
function cancelEdit(){ST.editId=null;pendingPhoto=null;renderV();}
function toggleSelectedDate(d){ST.selectedDate=ST.selectedDate===d?null:d;renderV();}
function prevPhoto(input){const f=input.files[0];if(!f)return;if(f.size>2*1024*1024){alert('Max 2 MB.');return;}const r=new FileReader();r.onload=e=>{pendingPhoto=e.target.result;const av=document.getElementById('pf-av');if(av)av.innerHTML=`<img src="${pendingPhoto}" style="width:100%;height:100%;object-fit:cover;">`;};r.readAsDataURL(f);}

async function savePl(editId){
  const name=(document.getElementById('pf-n')?.value||'').trim();if(!name){alert('Enter a name.');return;}
  const skills={};['speed','stamina','defending','attack'].forEach(k=>{skills[k]=parseInt(document.getElementById('pf-'+k)?.value||3);});
  const nationality=(document.getElementById('pf-nat')?.value||'')||null;
  if(editId==='__new__'){const id=uid();ST.players.push({id,name,skills,nationality,photo:pendingPhoto||null});if(pendingPhoto)await savePh(id,pendingPhoto);}
  else{const idx=ST.players.findIndex(p=>p.id===editId);if(idx>=0){ST.players[idx]={...ST.players[idx],name,skills,nationality};if(pendingPhoto){ST.players[idx].photo=pendingPhoto;await savePh(editId,pendingPhoto);}}}
  pendingPhoto=null;ST.editId=null;await SAVE();renderV();
}
async function delPl(id){if(!confirm('Delete this player?'))return;ST.players=ST.players.filter(p=>p.id!==id);try{await db.ref('lues/photos/'+id).remove();}catch(e){}ST.editId=null;await SAVE();renderV();}

async function createTodaySession(){
  const key=todayKey();
  if(!ST.weeks[key])ST.weeks[key]={date:key,votes:[],locked:false,teams:null,openTime:'09:30',closeTime:'19:00'};
  await SAVE();renderV();
}

async function scheduleSession(){
  const date=document.getElementById('sched-date')?.value;
  if(!date){alert('Please select a date.');return;}
  if(ST.weeks[date]){
    alert('A session already exists for this date.');
    ST.schedulingNew=false;
    if(date!==todayKey())ST.selectedDate=date;
    renderV();return;
  }
  const openTime=document.getElementById('sched-open')?.value||'09:30';
  const closeTime=document.getElementById('sched-close')?.value||'19:00';
  ST.weeks[date]={date,votes:[],locked:false,teams:null,openTime,closeTime};
  ST.schedulingNew=false;
  if(date!==todayKey())ST.selectedDate=date;
  await SAVE();renderV();
}

async function deleteSession(weekDate){
  if(!confirm(`Delete the session on ${fmtD(weekDate)}?`))return;
  delete ST.weeks[weekDate];
  if(ST.selectedDate===weekDate)ST.selectedDate=null;
  if(ST.historyKey===weekDate)ST.historyKey=null;
  await SAVE();renderV();
}

async function updateSessionTimes(weekDate){
  const week=ST.weeks[weekDate];if(!week)return;
  const openEl=document.getElementById('wt-open-'+weekDate);
  const closeEl=document.getElementById('wt-close-'+weekDate);
  if(!openEl||!closeEl)return;
  week.openTime=openEl.value||'09:30';
  week.closeTime=closeEl.value||'19:00';
  await SAVE();renderV();
}

async function userVote(){
  const name=(document.getElementById('uv-sel')?.value||'').trim();
  const msg=document.getElementById('uv-m');
  if(!name){if(msg)msg.innerHTML=`<span style="color:#fca5a5;">Please select your name.</span>`;return;}
  const fmt=getFmt();const key=todayKey();
  if(!ST.weeks[key])ST.weeks[key]={date:key,votes:[],locked:false,teams:null,openTime:'09:30',closeTime:'19:00'};
  const week=ST.weeks[key];
  if(week.locked||week.votes.length>=fmt.target){if(msg)msg.innerHTML=`<span style="color:#fca5a5;">Voting is closed.</span>`;return;}
  if(week.votes.some(v=>v.name.toLowerCase()===name.toLowerCase())){if(msg)msg.innerHTML=`<span style="color:#fde68a;">${escH(name)} is already checked in.</span>`;return;}
  week.votes.push({name,timestamp:new Date().toISOString()});
  if(week.votes.length>=fmt.target&&!week.locked){week.locked=true;const r=genTeams(week.votes);week.teams=buildTeamsObj(r,fmt);}
  await SAVE();renderV();
}

async function adminAV(weekDate){
  const name=(document.getElementById('av-sel')?.value||'').trim();if(!name)return;
  if(!ST.weeks[weekDate])ST.weeks[weekDate]={date:weekDate,votes:[],locked:false,teams:null,openTime:'09:30',closeTime:'19:00'};
  const week=ST.weeks[weekDate];const fmt=getFmt();
  if(week.votes.some(v=>v.name.toLowerCase()===name.toLowerCase())){alert(`${name} already checked in.`);return;}
  week.votes.push({name,timestamp:new Date().toISOString()});
  if(week.votes.length>=fmt.target&&!week.locked){week.locked=true;const r=genTeams(week.votes);week.teams=buildTeamsObj(r,fmt);}
  await SAVE();renderV();
}

async function rmV(weekDate,idx){const week=ST.weeks[weekDate];if(!week)return;week.votes.splice(idx,1);await SAVE();renderV();}
async function toggleLock(weekDate){if(!ST.weeks[weekDate])ST.weeks[weekDate]={date:weekDate,votes:[],locked:false,teams:null,openTime:'09:30',closeTime:'19:00'};ST.weeks[weekDate].locked=!ST.weeks[weekDate].locked;await SAVE();renderV();}
async function doGenT(weekDate){const week=ST.weeks[weekDate];if(!week)return;const fmt=getFmt();const r=genTeams(week.votes);week.teams=buildTeamsObj(r,fmt);await SAVE();renderV();}
async function saveGW(weekDate){
  const week=ST.weeks[weekDate];if(!week)return;const fmt=getFmt();if(fmt.mode==='dropin')return;
  week.gamesWon={red:parseInt(document.getElementById('gw-red')?.value||0),white:parseInt(document.getElementById('gw-white')?.value||0)};
  if(fmt.mode==='3x5')week.gamesWon.blue=parseInt(document.getElementById('gw-blue')?.value||0);
  await SAVE();renderV();
}

// ══════════════════════════════════════════════
//  CLOCK & AUTO-REFRESH TICKER
// ══════════════════════════════════════════════
let _renderPending=false;
let _lastSec=-1;

setInterval(()=>{
  const cp=nowClockParts();
  const timeStr=`${cp.h12}<span class="hdr-clock-colon">:</span>${cp.min}<span class="hdr-clock-colon">:</span>${cp.sec} ${cp.ampm}`;

  // ── Header clock (logged-in) ──
  const hdrEl=document.getElementById('hdr-clock');
  if(hdrEl)hdrEl.innerHTML=timeStr;

  // ── Login page live clock ──
  const loginClockEl=document.getElementById('login-live-clock');
  if(loginClockEl)loginClockEl.innerHTML=timeStr;

  // ── No-session card clock ──
  const clockEl=document.getElementById('abclock');
  if(clockEl)clockEl.textContent=nowClock();

  const info=getNextSessionInfo();

  // ── Login page segmented countdown ──
  const loginCdWrap=document.getElementById('login-cd-wrap');
  if(info&&!info.isOpen&&loginCdWrap){
    const p=cdParts(info.ms);
    if(p){
      const dEl=loginCdWrap.querySelector('#cd-d');if(dEl)dEl.textContent=p.d;
      const hEl=loginCdWrap.querySelector('#cd-h');if(hEl)hEl.textContent=p.h;
      const mEl=loginCdWrap.querySelector('#cd-m');if(mEl)mEl.textContent=p.m;
      const sEl=loginCdWrap.querySelector('#cd-s');if(sEl)sEl.textContent=p.s;
    }
  }

  // ── No-session card segmented countdown ──
  const nosessCdWrap=document.getElementById('nosess-cd-wrap');
  if(info&&!info.isOpen&&nosessCdWrap){
    const p=cdParts(info.ms);
    if(p){
      const dEl=nosessCdWrap.querySelector('#cd-d');if(dEl)dEl.textContent=p.d;
      const hEl=nosessCdWrap.querySelector('#cd-h');if(hEl)hEl.textContent=p.h;
      const mEl=nosessCdWrap.querySelector('#cd-m');if(mEl)mEl.textContent=p.m;
      const sEl=nosessCdWrap.querySelector('#cd-s');if(sEl)sEl.textContent=p.s;
    }
  }

  // ── Inline user-cd text (upcoming list) ──
  const userCdEl=document.getElementById('user-cd');
  if(info&&!info.isOpen&&userCdEl)userCdEl.textContent=fmtCountdown(info.ms);

  // ── Auto-trigger render when session opens ──
  if(info&&!info.isOpen&&info.ms<=1500&&!_renderPending){
    _renderPending=true;
    setTimeout(()=>{_renderPending=false;renderV();},info.ms+200);
  }
},1000);

(async function(){
  const MIN_MS=1800;const t0=Date.now();
  showLoader('Connecting to Firebase…',99999,null);
  await LOAD();
  const wait=Math.max(0,MIN_MS-(Date.now()-t0));
  setTimeout(()=>{
    const d=document.getElementById('lues-ldr');
    if(d){d.style.transition='opacity .4s ease';d.style.opacity='0';setTimeout(()=>{d.remove();renderV();},420);}
    else renderV();
  },wait);
})();
