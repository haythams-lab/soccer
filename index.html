
<h2 class="sr-only">LUES Soccer Club — team management and voting system</h2>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
#la{color:var(--color-text-primary);font-family:var(--font-sans);}
.tab{padding:6px 13px;border:none;background:transparent;border-radius:8px;cursor:pointer;font-size:13px;color:var(--color-text-secondary);font-family:var(--font-sans);}
.tab.on{background:var(--color-background-primary);color:var(--color-text-primary);border:.5px solid var(--color-border-secondary);font-weight:500;}
.card{background:var(--color-background-primary);border:.5px solid var(--color-border-tertiary);border-radius:12px;padding:16px 20px;margin-bottom:12px;}
.sec{background:var(--color-background-secondary);border:.5px solid var(--color-border-tertiary);border-radius:12px;padding:16px 20px;margin-bottom:12px;}
.btn{padding:7px 15px;border-radius:8px;border:.5px solid var(--color-border-secondary);background:transparent;cursor:pointer;font-size:13px;color:var(--color-text-primary);font-family:var(--font-sans);}
.btn:hover{background:var(--color-background-secondary);}
.btnp{background:#1b3d6e!important;color:white!important;border-color:#1b3d6e!important;}
.btnd{background:var(--color-background-danger)!important;color:var(--color-text-danger)!important;border-color:var(--color-border-danger)!important;}
.btns{background:var(--color-background-success)!important;color:var(--color-text-success)!important;border-color:var(--color-border-success)!important;}
.btnw{background:var(--color-background-warning)!important;color:var(--color-text-warning)!important;border-color:var(--color-border-warning)!important;}
.bsm{padding:4px 10px!important;font-size:12px!important;}
.badge{display:inline-flex;align-items:center;padding:3px 10px;border-radius:6px;font-size:12px;font-weight:500;}
.bs{background:var(--color-background-success);color:var(--color-text-success);}
.bd{background:var(--color-background-danger);color:var(--color-text-danger);}
.bi{background:var(--color-background-info);color:var(--color-text-info);}
.bw{background:var(--color-background-warning);color:var(--color-text-warning);}
.fg{display:flex;flex-direction:column;margin-bottom:12px;}
.fg label{font-size:13px;color:var(--color-text-secondary);margin-bottom:5px;}
.fg input,.fg select{width:100%;}
.plcard{display:flex;align-items:flex-start;gap:12px;padding:12px;border:.5px solid var(--color-border-tertiary);border-radius:10px;margin-bottom:8px;}
.vrow{display:flex;justify-content:space-between;align-items:center;padding:7px 10px;background:var(--color-background-secondary);border-radius:7px;margin-bottom:5px;font-size:13px;}
.tcard{border-radius:12px;padding:14px;margin-bottom:12px;}
.tred{border:2px solid #c53030;background:#fff5f5;}
.twht{border:2px solid #4a5568;background:var(--color-background-primary);}
.tblu{border:2px solid #2b6cb0;background:#ebf4ff;}
.tsub{border:2px solid var(--color-border-secondary);background:var(--color-background-secondary);}
.prow{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:.5px solid var(--color-border-tertiary);}
.prow:last-child{border-bottom:none;}
.ovb{width:28px;height:28px;border-radius:50%;background:#1b3d6e;color:white;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:500;flex-shrink:0;}
.hrow{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border:.5px solid var(--color-border-tertiary);border-radius:8px;margin-bottom:8px;cursor:pointer;}
.hrow:hover{background:var(--color-background-secondary);}
.wrow{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;margin-bottom:5px;background:var(--color-background-secondary);}
.wrnk{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:500;flex-shrink:0;}
.r1{background:#ffd700;color:#7a4500;}.r2{background:#c0c0c0;color:#3a3a3a;}.r3{background:#c87941;color:#3a1000;}.rn{background:var(--color-background-tertiary);color:var(--color-text-secondary);}
.divider{height:.5px;background:var(--color-border-tertiary);margin:12px 0;}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;}
@media(prefers-color-scheme:dark){.tred{background:rgba(197,48,48,.12);}.tblu{background:rgba(43,108,176,.12);}}
</style>
<div id="la">
  <div id="lh" style="display:none;"></div>
  <div id="ln" style="display:none;"></div>
  <div id="lc" style="padding:16px;"></div>
</div>
<script>
const ADMIN={u:'LUESadmin',p:'Lacombe202620252024!@'};
const USR={u:'LUESuser',p:'Users2026!!'};
const TARGET=15;
let ST={user:null,players:[],weeks:{},view:'login',editId:null,historyKey:null,monthFilter:null};
let pendingPhoto=null;
const hasST=typeof window!=='undefined'&&window.storage;

async function SAVE(){
  if(!hasST)return;
  try{await window.storage.set('lues_p',JSON.stringify(ST.players.map(p=>({...p,photo:undefined}))));await window.storage.set('lues_w',JSON.stringify(ST.weeks));}catch(e){}
}
async function savePh(id,d){if(!hasST)return;try{await window.storage.set('lues_ph_'+id,d);}catch(e){}}
async function LOAD(){
  if(!hasST)return;
  try{const r=await window.storage.get('lues_p');if(r)ST.players=JSON.parse(r.value);}catch(e){ST.players=[];}
  try{const r=await window.storage.get('lues_w');if(r)ST.weeks=JSON.parse(r.value);}catch(e){ST.weeks={};}
  for(const p of ST.players){try{const r=await window.storage.get('lues_ph_'+p.id);if(r)p.photo=r.value;}catch(e){}}
}

function getAB(){return new Date(new Date().toLocaleString('en-US',{timeZone:'America/Edmonton'}));}
function isSun(){return getAB().getDay()===0;}
function after930(){const t=getAB();return t.getHours()>9||(t.getHours()===9&&t.getMinutes()>=30);}
function todayKey(){const t=getAB();return`${t.getFullYear()}-${String(t.getMonth()+1).padStart(2,'0')}-${String(t.getDate()).padStart(2,'0')}`;}
function fmtT(iso){return new Date(iso).toLocaleTimeString('en-US',{timeZone:'America/Edmonton',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:true});}
function fmtD(k){return new Date(k+'T12:00:00').toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric'});}
function nowClock(){return new Date().toLocaleTimeString('en-US',{timeZone:'America/Edmonton',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:true});}

function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
function initials(n){return(n||'?').trim().split(/\s+/).map(w=>w[0]).join('').toUpperCase().slice(0,2);}
function sAvg(sk){if(!sk)return 5;const v=Object.values(sk);return Math.round(v.reduce((a,b)=>a+b,0)/v.length);}
function sCol(v){return v>=8?'#16a34a':v>=6?'#2563eb':v>=4?'#d97706':'#dc2626';}
function escH(s){return(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

function avH(name,photo,sz){
  sz=sz||40;
  const s=`width:${sz}px;height:${sz}px;border-radius:50%;flex-shrink:0;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:${Math.round(sz*.32)}px;font-weight:500;`;
  if(photo)return`<div style="${s}"><img src="${photo}" style="width:100%;height:100%;object-fit:cover;"></div>`;
  return`<div style="${s}background:#dbeafe;color:#1e40af;">${initials(name)}</div>`;
}

function sBars(sk){
  if(!sk)return'';
  return[['Speed','speed'],['Shooting','shooting'],['Passing','passing'],['Defense','defense'],['Stamina','stamina']].map(([l,k])=>{
    const v=sk[k]||5;
    return`<div style="display:flex;align-items:center;gap:5px;margin:2px 0;"><span style="font-size:10px;color:var(--color-text-secondary);width:42px;flex-shrink:0;">${l}</span><div style="flex:1;height:3px;background:var(--color-background-tertiary);border-radius:2px;overflow:hidden;"><div style="width:${v*10}%;height:100%;background:${sCol(v)};border-radius:2px;"></div></div><span style="font-size:10px;color:var(--color-text-secondary);width:12px;text-align:right;">${v}</span></div>`;
  }).join('');
}

function pDL(){return`<datalist id="pl-dl">${ST.players.map(p=>`<option value="${escH(p.name)}">`).join('')}</datalist>`;}

function genTeams(votes){
  const first=votes.slice(0,TARGET).map(v=>{
    const pl=ST.players.find(p=>p.name.toLowerCase()===v.name.toLowerCase());
    return{name:v.name,timestamp:v.timestamp,skills:pl&&pl.skills?pl.skills:{speed:5,shooting:5,passing:5,defense:5,stamina:5},photo:pl?pl.photo||null:null,overall:pl?sAvg(pl.skills):5};
  });
  const subs=votes.slice(TARGET).map(v=>({name:v.name,timestamp:v.timestamp}));
  first.sort((a,b)=>b.overall-a.overall);
  const t=[[],[],[]];
  [0,1,2,2,1,0,0,1,2,2,1,0,0,1,2].forEach((ti,i)=>t[ti].push(first[i]));
  return{red:t[0],white:t[1],blue:t[2],subs};
}

function V_login(){
  return`<div style="display:flex;flex-direction:column;align-items:center;padding:2.5rem 1rem;">
    <div style="width:72px;height:72px;border-radius:50%;background:#1b3d6e;border:3px solid #c53030;display:flex;align-items:center;justify-content:center;margin-bottom:14px;">
      <svg width="34" height="34" viewBox="0 0 34 34" fill="none"><circle cx="17" cy="17" r="14" stroke="white" stroke-width="1.5"/><ellipse cx="17" cy="17" rx="6" ry="14" stroke="white" stroke-width="1" fill="none"/><line x1="3" y1="17" x2="31" y2="17" stroke="white" stroke-width="1"/><path d="M3.8 11Q17 14 30.2 11" stroke="white" stroke-width="1" fill="none"/><path d="M3.8 23Q17 20 30.2 23" stroke="white" stroke-width="1" fill="none"/></svg>
    </div>
    <div style="font-size:20px;font-weight:500;margin-bottom:4px;">LUES Soccer Club</div>
    <div style="font-size:13px;color:var(--color-text-secondary);margin-bottom:28px;">Team management &amp; voting system</div>
    <div class="card" style="width:100%;max-width:360px;">
      <div class="fg"><label>Username</label><input id="li-u" type="text" placeholder="Enter username" autocomplete="username" onkeydown="if(event.key==='Enter')document.getElementById('li-p').focus()"></div>
      <div class="fg"><label>Password</label><input id="li-p" type="password" placeholder="Enter password" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()"></div>
      <div id="li-e" style="color:var(--color-text-danger);font-size:13px;margin-bottom:10px;display:none;">Incorrect username or password.</div>
      <button class="btn btnp" onclick="doLogin()" style="width:100%;">Sign in</button>
      <div style="font-size:11px;color:var(--color-text-tertiary);text-align:center;margin-top:10px;">Admin or member login</div>
    </div>
  </div>`;
}

function V_ap(){
  const isNew=ST.editId==='__new__';
  const editing=isNew?null:ST.players.find(p=>p.id===ST.editId);
  const showForm=ST.editId!==null;
  let form='';
  if(showForm){
    const pl=editing||{name:'',skills:{speed:5,shooting:5,passing:5,defense:5,stamina:5},photo:null};
    form=`<div class="card" style="border:2px solid #1b3d6e;margin-bottom:16px;">
      <div style="font-size:15px;font-weight:500;margin-bottom:14px;">${isNew?'Add new player':'Edit player'}</div>
      <div class="fg"><label>Full name</label><input id="pf-n" type="text" value="${escH(pl.name||'')}" placeholder="Player name"></div>
      <div style="font-size:13px;font-weight:500;color:var(--color-text-secondary);margin-bottom:10px;">Skills (1–10)</div>
      <div class="g2" style="margin-bottom:12px;">
        ${['speed','shooting','passing','defense','stamina'].map(k=>`<div>
          <div style="font-size:12px;color:var(--color-text-secondary);margin-bottom:4px;">${k.charAt(0).toUpperCase()+k.slice(1)}</div>
          <div style="display:flex;align-items:center;gap:6px;">
            <input type="range" id="pf-${k}" min="1" max="10" step="1" value="${pl.skills&&pl.skills[k]?pl.skills[k]:5}" oninput="document.getElementById('pv-${k}').textContent=this.value" style="flex:1;">
            <span id="pv-${k}" style="font-size:13px;width:20px;text-align:right;">${pl.skills&&pl.skills[k]?pl.skills[k]:5}</span>
          </div>
        </div>`).join('')}
      </div>
      <div class="divider"></div>
      <div class="fg">
        <label>Player photo (optional)</label>
        <div style="display:flex;align-items:center;gap:12px;">
          <div id="pf-av" style="width:52px;height:52px;border-radius:50%;overflow:hidden;flex-shrink:0;background:#dbeafe;color:#1e40af;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:500;">${pl.photo?`<img src="${pl.photo}" style="width:100%;height:100%;object-fit:cover;">`:initials(pl.name||'?')}</div>
          <div><input type="file" id="pf-ph" accept="image/*" onchange="prevPhoto(this)" style="font-size:12px;"><div style="font-size:11px;color:var(--color-text-tertiary);margin-top:3px;">JPG or PNG · max 2 MB</div></div>
        </div>
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;">
        <button class="btn btnp" onclick="savePl('${isNew?'__new__':editing.id}')">Save player</button>
        <button class="btn" onclick="cancelEdit()">Cancel</button>
        ${!isNew?`<button class="btn btnd" onclick="delPl('${editing.id}')" style="margin-left:auto;">Delete</button>`:''}
      </div>
    </div>`;
  }
  const list=ST.players.length===0
    ?`<div style="text-align:center;color:var(--color-text-secondary);font-size:13px;padding:2rem;">No players in roster yet. Add your first player above.</div>`
    :ST.players.map(p=>`<div class="plcard">
        ${avH(p.name,p.photo,44)}
        <div style="flex:1;min-width:0;">
          <div style="font-size:14px;font-weight:500;">${escH(p.name)}</div>
          <div style="font-size:11px;color:var(--color-text-secondary);margin-bottom:3px;">Overall: <strong>${sAvg(p.skills)}/10</strong></div>
          ${sBars(p.skills)}
        </div>
        <button class="btn bsm" onclick="startEdit('${p.id}')">Edit</button>
      </div>`).join('');
  return(showForm?'':
    `<button class="btn btnp" onclick="startEdit('__new__')" style="margin-bottom:14px;">+ Add player</button>
     <div style="font-size:13px;color:var(--color-text-secondary);margin-bottom:10px;">${ST.players.length} player${ST.players.length!==1?'s':''} in roster</div>`)
    +form+list;
}

function V_aw(){
  if(!isSun())return`<div class="sec" style="text-align:center;padding:2rem;">
    <div style="font-size:15px;font-weight:500;margin-bottom:8px;">No active session</div>
    <div style="font-size:13px;color:var(--color-text-secondary);">Voting takes place every Sunday starting at 9:30 AM Alberta time.</div>
    <div style="margin-top:12px;font-size:12px;color:var(--color-text-tertiary);">Current time: <strong id="abclock">--</strong></div>
  </div>`;
  if(!after930())return`<div class="sec" style="text-align:center;padding:2rem;">
    <div style="font-size:15px;font-weight:500;margin-bottom:8px;">Session opens soon</div>
    <div style="font-size:13px;color:var(--color-text-secondary);">Voting opens at 9:30 AM Alberta time today.</div>
    <div style="margin-top:12px;font-size:13px;">Current time: <strong id="abclock">--</strong></div>
  </div>`;
  const key=todayKey();
  const week=ST.weeks[key]||{date:key,votes:[],locked:false,teams:null};
  return weekHTML(week,true);
}

function V_ah(){
  if(ST.historyKey){
    const w=ST.weeks[ST.historyKey];
    if(!w){ST.historyKey=null;return V_ah();}
    return`<button class="btn bsm" onclick="goBack()" style="margin-bottom:14px;">← Back to history</button>
      <div style="font-size:15px;font-weight:500;margin-bottom:12px;">${fmtD(w.date)}</div>
      ${weekHTML(w,true)}`;
  }
  const keys=Object.keys(ST.weeks).sort((a,b)=>b.localeCompare(a));
  if(!keys.length)return`<div style="text-align:center;color:var(--color-text-secondary);font-size:13px;padding:2rem;">No history yet. Sunday session data will appear here.</div>`;
  return keys.map(k=>{
    const w=ST.weeks[k];
    return`<div class="hrow" onclick="viewHist('${k}')">
      <div>
        <div style="font-size:14px;font-weight:500;">${fmtD(k)}</div>
        <div style="font-size:12px;color:var(--color-text-secondary);margin-top:3px;">${w.votes?w.votes.length:0} players &middot; ${w.teams?'Teams generated':'No teams'} &middot; ${w.gamesWon?'Results saved':'No results'}</div>
      </div>
      <span style="font-size:18px;color:var(--color-text-tertiary);">›</span>
    </div>`;
  }).join('');
}

function V_am(){
  const now=getAB();
  const curM=`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;
  if(!ST.monthFilter)ST.monthFilter=curM;
  const months=[...new Set(Object.keys(ST.weeks).map(k=>k.slice(0,7)))].sort((a,b)=>b.localeCompare(a));
  if(months.length&&!months.includes(ST.monthFilter))ST.monthFilter=months[0];
  const winners=mWinners(ST.monthFilter);
  const mLabel=new Date(ST.monthFilter+'-15').toLocaleString('en-US',{month:'long',year:'numeric'});
  return`<div style="display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap;">
    <div style="font-size:15px;font-weight:500;">Monthly leaderboard</div>
    <select onchange="ST.monthFilter=this.value;renderV()" style="font-size:13px;">
      ${months.length?months.map(m=>`<option value="${m}"${m===ST.monthFilter?' selected':''}>${new Date(m+'-15').toLocaleString('en-US',{month:'long',year:'numeric'})}</option>`).join(''):`<option value="${curM}">${mLabel}</option>`}
    </select>
  </div>
  ${!winners.length
    ?`<div style="text-align:center;color:var(--color-text-secondary);font-size:13px;padding:2rem;">No game results recorded for ${mLabel} yet.</div>`
    :winners.map((w,i)=>{
      const pl=ST.players.find(p=>p.name.toLowerCase()===w.name.toLowerCase());
      return`<div class="wrow"><div class="wrnk ${i===0?'r1':i===1?'r2':i===2?'r3':'rn'}">${i+1}</div>${avH(w.name,pl?pl.photo:null,32)}<span style="font-size:14px;font-weight:500;flex:1;">${escH(w.name)}</span><span style="font-size:13px;color:var(--color-text-secondary);">${w.wins} game win${w.wins!==1?'s':''}</span></div>`;
    }).join('')}`;
}

function mWinners(prefix){
  const wins={};
  Object.entries(ST.weeks).forEach(([k,w])=>{
    if(!k.startsWith(prefix)||!w.teams||!w.gamesWon)return;
    ['red','white','blue'].forEach(c=>{
      const g=w.gamesWon[c]||0;
      if(g>0)(w.teams[c]||[]).forEach(p=>{wins[p.name]=(wins[p.name]||0)+g;});
    });
  });
  return Object.entries(wins).map(([name,wins])=>({name,wins})).sort((a,b)=>b.wins-a.wins);
}

function V_uh(){
  if(!isSun()||!after930()){
    const msg=!isSun()?'Voting is available every Sunday at 9:30 AM Alberta time.':'Voting opens at 9:30 AM today.';
    return`<div class="sec" style="text-align:center;padding:2rem;">
      <div style="font-size:15px;font-weight:500;margin-bottom:8px;">Voting not open</div>
      <div style="font-size:13px;color:var(--color-text-secondary);">${msg}</div>
      <div style="margin-top:12px;font-size:13px;">Alberta time: <strong id="abclock">--</strong></div>
    </div>`;
  }
  const key=todayKey();
  const week=ST.weeks[key]||{date:key,votes:[],locked:false,teams:null};
  const isLocked=week.locked,vCount=week.votes?week.votes.length:0;
  let vform='';
  if(!isLocked&&vCount<TARGET){
    vform=`<div class="card" style="margin-bottom:12px;">
      <div style="font-size:14px;font-weight:500;margin-bottom:10px;">Check in for today's session</div>
      <div style="font-size:12px;color:var(--color-text-secondary);margin-bottom:10px;">Voting opens at 9:30 AM and closes when ${TARGET} players have registered.</div>
      ${pDL()}
      <div style="display:flex;gap:8px;">
        <input id="uv-n" type="text" placeholder="Your full name" style="flex:1;" list="pl-dl" onkeydown="if(event.key==='Enter')userVote()">
        <button class="btn btnp bsm" onclick="userVote()">Check in</button>
      </div>
      <div id="uv-m" style="font-size:12px;margin-top:8px;"></div>
    </div>`;
  }else{
    vform=`<div class="sec" style="text-align:center;padding:10px;margin-bottom:12px;"><span class="badge bd">Voting closed — ${vCount}/${TARGET} registered</span></div>`;
  }
  return vform+weekHTML(week,false);
}

function V_uhist(){
  if(ST.historyKey){
    const w=ST.weeks[ST.historyKey];
    if(!w){ST.historyKey=null;return V_uhist();}
    return`<button class="btn bsm" onclick="goBack()" style="margin-bottom:14px;">← Back</button>
      <div style="font-size:15px;font-weight:500;margin-bottom:12px;">${fmtD(w.date)}</div>
      ${weekHTML(w,false)}`;
  }
  const keys=Object.keys(ST.weeks).sort((a,b)=>b.localeCompare(a));
  if(!keys.length)return`<div style="text-align:center;color:var(--color-text-secondary);font-size:13px;padding:2rem;">No history yet.</div>`;
  return keys.map(k=>{
    const w=ST.weeks[k];
    return`<div class="hrow" onclick="viewHist('${k}')">
      <div>
        <div style="font-size:14px;font-weight:500;">${fmtD(k)}</div>
        <div style="font-size:12px;color:var(--color-text-secondary);margin-top:3px;">${w.votes?w.votes.length:0} players</div>
      </div>
      <span style="font-size:18px;color:var(--color-text-tertiary);">›</span>
    </div>`;
  }).join('');
}

function weekHTML(week,isAdmin){
  if(!week)return'';
  const votes=week.votes||[],isLocked=week.locked,vCount=votes.length,hasTeams=!!week.teams;
  const voterList=`<div class="card" style="margin-bottom:12px;">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;flex-wrap:wrap;gap:8px;">
      <div>
        <div style="font-size:15px;font-weight:500;">${fmtD(week.date)}</div>
        <div style="margin-top:4px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
          <span style="font-size:13px;color:var(--color-text-secondary);">${vCount}/${TARGET} registered</span>
          ${isLocked?`<span class="badge bd">Locked</span>`:`<span class="badge bs">Open</span>`}
        </div>
      </div>
      ${isAdmin?`<div style="display:flex;gap:6px;flex-wrap:wrap;">
        <button class="btn bsm ${isLocked?'btnw':'btnd'}" onclick="toggleLock('${week.date}')">${isLocked?'Unlock':'Lock voting'}</button>
        ${(isLocked||vCount>=TARGET)?`<button class="btn bsm btnp" onclick="doGenT('${week.date}')">${hasTeams?'Regenerate':'Generate teams'}</button>`:''}</div>`:''}
    </div>
    <div style="height:6px;background:var(--color-background-tertiary);border-radius:3px;margin-bottom:12px;overflow:hidden;">
      <div style="width:${Math.min(100,Math.round(vCount/TARGET*100))}%;height:100%;background:#1b3d6e;border-radius:3px;transition:width .3s;"></div>
    </div>
    ${votes.length===0?`<div style="font-size:13px;color:var(--color-text-secondary);text-align:center;padding:12px 0;">No players registered yet.</div>`:''}
    ${votes.map((v,i)=>{
      const pl=ST.players.find(p=>p.name.toLowerCase()===v.name.toLowerCase());
      return`<div class="vrow">
        <div style="display:flex;align-items:center;gap:8px;">
          <div style="width:20px;height:20px;border-radius:50%;background:${i<TARGET?'#1b3d6e':'#718096'};color:white;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:500;flex-shrink:0;">${i+1}</div>
          ${pl&&pl.photo?`<div style="width:22px;height:22px;border-radius:50%;overflow:hidden;flex-shrink:0;"><img src="${pl.photo}" style="width:100%;height:100%;object-fit:cover;"></div>`:''}
          <span style="font-weight:${i<TARGET?500:400};">${escH(v.name)}</span>
          ${i>=TARGET?`<span class="badge bw" style="font-size:10px;padding:1px 6px;">Sub</span>`:''}
          ${!pl?`<span class="badge" style="background:var(--color-background-warning);color:var(--color-text-warning);font-size:10px;padding:1px 6px;">Not in roster</span>`:''}
        </div>
        <div style="display:flex;align-items:center;gap:6px;">
          <span style="font-size:11px;color:var(--color-text-tertiary);">${fmtT(v.timestamp)}</span>
          ${isAdmin?`<button class="btn bsm btnd" onclick="rmV('${week.date}',${i})" style="padding:2px 7px!important;line-height:1.2;">×</button>`:''}
        </div>
      </div>`;
    }).join('')}
    ${isAdmin&&!isLocked?`<div class="divider"></div>
      <div style="font-size:13px;font-weight:500;margin-bottom:8px;">Add player manually (admin)</div>
      ${pDL()}
      <div style="display:flex;gap:8px;">
        <input id="av-n" type="text" placeholder="Player name" style="flex:1;" list="pl-dl" onkeydown="if(event.key==='Enter')adminAV('${week.date}')">
        <button class="btn bsm btnp" onclick="adminAV('${week.date}')">Add</button>
      </div>`:''}
  </div>`;
  let teamsHTML='';
  if(hasTeams&&week.teams){
    const t=week.teams;
    teamsHTML=`<div style="font-size:15px;font-weight:500;margin-bottom:10px;">Teams</div>`;
    [{k:'red',lbl:'Red team',cls:'tred',dot:'#c53030'},{k:'white',lbl:'White team',cls:'twht',dot:'#4a5568'},{k:'blue',lbl:'Blue team',cls:'tblu',dot:'#2b6cb0'}].forEach(d=>{
      const players=t[d.k]||[];
      const avg=players.length?Math.round(players.reduce((s,p)=>s+p.overall,0)/players.length):0;
      teamsHTML+=`<div class="tcard ${d.cls}">
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px;">
          <div style="width:12px;height:12px;border-radius:50%;background:${d.dot};flex-shrink:0;"></div>
          <span style="font-size:14px;font-weight:500;">${d.lbl}</span>
          <span style="font-size:12px;color:var(--color-text-secondary);margin-left:auto;">Avg ${avg}/10</span>
        </div>
        ${players.map(p=>{
          const rp=ST.players.find(r=>r.name.toLowerCase()===p.name.toLowerCase());
          return`<div class="prow">${avH(p.name,(rp&&rp.photo)||p.photo,32)}<span style="font-size:13px;font-weight:500;flex:1;">${escH(p.name)}</span><div class="ovb">${p.overall}</div></div>`;
        }).join('')}
      </div>`;
    });
    if(t.subs&&t.subs.length){
      teamsHTML+=`<div class="tcard tsub">
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px;">
          <div style="width:12px;height:12px;border-radius:50%;background:#718096;flex-shrink:0;"></div>
          <span style="font-size:14px;font-weight:500;">Substitutes (${t.subs.length})</span>
        </div>
        ${t.subs.map(s=>`<div class="prow">${avH(s.name,null,28)}<span style="font-size:13px;flex:1;">${escH(s.name)}</span><span style="font-size:11px;color:var(--color-text-tertiary);">${fmtT(s.timestamp)}</span></div>`).join('')}
      </div>`;
    }
    if(isAdmin){
      const gw=week.gamesWon||{red:0,white:0,blue:0};
      teamsHTML+=`<div class="card" style="margin-top:4px;">
        <div style="font-size:14px;font-weight:500;margin-bottom:4px;">Record game results</div>
        <div style="font-size:12px;color:var(--color-text-secondary);margin-bottom:12px;">Enter how many games each team won today.</div>
        <div class="g3">
          ${['red','white','blue'].map(c=>`<div>
            <div style="font-size:12px;color:var(--color-text-secondary);margin-bottom:5px;">${c.charAt(0).toUpperCase()+c.slice(1)} team wins</div>
            <input type="number" id="gw-${c}" min="0" max="99" value="${gw[c]||0}" style="width:100%;">
          </div>`).join('')}
        </div>
        <div style="display:flex;align-items:center;gap:10px;margin-top:12px;">
          <button class="btn btnp bsm" onclick="saveGW('${week.date}')">Save results</button>
          ${week.gamesWon?`<span style="font-size:12px;color:var(--color-text-success);">Results saved</span>`:''}
        </div>
      </div>`;
    }
  }
  return voterList+teamsHTML;
}

function renderV(){
  const lh=document.getElementById('lh');
  const ln=document.getElementById('ln');
  const lc=document.getElementById('lc');
  if(!ST.user){
    lh.style.display='none';ln.style.display='none';
    lc.style.padding='16px';lc.innerHTML=V_login();return;
  }
  const isAdmin=ST.user.role==='admin';
  lh.style.cssText='display:flex;align-items:center;justify-content:space-between;background:#1b3d6e;color:white;padding:10px 16px;';
  lh.innerHTML=`<div style="display:flex;align-items:center;gap:10px;">
    <div style="width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.15);border:1.5px solid rgba(255,255,255,.3);display:flex;align-items:center;justify-content:center;flex-shrink:0;">
      <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><circle cx="9" cy="9" r="7.5" stroke="white" stroke-width=".8"/><ellipse cx="9" cy="9" rx="3" ry="7.5" stroke="white" stroke-width=".6" fill="none"/><line x1="1.5" y1="9" x2="16.5" y2="9" stroke="white" stroke-width=".6"/><path d="M2 5.5Q9 7 16 5.5" stroke="white" stroke-width=".6" fill="none"/><path d="M2 12.5Q9 11 16 12.5" stroke="white" stroke-width=".6" fill="none"/></svg>
    </div>
    <div>
      <div style="font-size:14px;font-weight:500;">LUES Soccer Club</div>
      <div style="font-size:11px;opacity:.75;">${isAdmin?'Administrator':'Member'} account</div>
    </div>
  </div>
  <button onclick="doLogout()" style="background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.3);color:white;padding:4px 12px;border-radius:6px;cursor:pointer;font-size:12px;font-family:var(--font-sans);">Sign out</button>`;
  const navItems=isAdmin?[['ap','Players'],['aw','This week'],['ah','History'],['am','Monthly winners']]:[['uh','Vote'],['uhist','History']];
  ln.style.cssText='display:flex;gap:4px;padding:8px;background:var(--color-background-secondary);border-bottom:.5px solid var(--color-border-tertiary);overflow-x:auto;white-space:nowrap;';
  ln.innerHTML=navItems.map(([id,lbl])=>`<button class="tab ${ST.view===id?'on':''}" onclick="navTo('${id}')">${lbl}</button>`).join('');
  lc.style.padding='16px';
  const views={ap:V_ap,aw:V_aw,ah:V_ah,am:V_am,uh:V_uh,uhist:V_uhist};
  lc.innerHTML=(views[ST.view]||V_login)();
}

function doLogin(){
  const u=(document.getElementById('li-u')?.value||'').trim();
  const p=document.getElementById('li-p')?.value||'';
  if(u===ADMIN.u&&p===ADMIN.p){ST.user={role:'admin'};ST.view='aw';renderV();return;}
  if(u===USR.u&&p===USR.p){ST.user={role:'user'};ST.view='uh';renderV();return;}
  const e=document.getElementById('li-e');if(e)e.style.display='block';
}
function doLogout(){ST.user=null;ST.view='login';ST.editId=null;ST.historyKey=null;pendingPhoto=null;renderV();}
function navTo(v){ST.view=v;ST.historyKey=null;renderV();}
function viewHist(k){ST.historyKey=k;renderV();}
function goBack(){ST.historyKey=null;renderV();}
function startEdit(id){ST.editId=id;pendingPhoto=null;renderV();try{document.getElementById('la').scrollIntoView();}catch(e){}}
function cancelEdit(){ST.editId=null;pendingPhoto=null;renderV();}

function prevPhoto(input){
  const f=input.files[0];if(!f)return;
  if(f.size>2*1024*1024){alert('Photo must be under 2 MB.');return;}
  const r=new FileReader();
  r.onload=e=>{
    pendingPhoto=e.target.result;
    const av=document.getElementById('pf-av');
    if(av)av.innerHTML=`<img src="${pendingPhoto}" style="width:100%;height:100%;object-fit:cover;">`;
  };
  r.readAsDataURL(f);
}

async function savePl(editId){
  const name=(document.getElementById('pf-n')?.value||'').trim();
  if(!name){alert('Please enter a player name.');return;}
  const skills={};
  ['speed','shooting','passing','defense','stamina'].forEach(k=>{skills[k]=parseInt(document.getElementById('pf-'+k)?.value||5);});
  if(editId==='__new__'){
    const id=uid();
    ST.players.push({id,name,skills,photo:pendingPhoto||null});
    if(pendingPhoto)await savePh(id,pendingPhoto);
  }else{
    const idx=ST.players.findIndex(p=>p.id===editId);
    if(idx>=0){ST.players[idx]={...ST.players[idx],name,skills};if(pendingPhoto){ST.players[idx].photo=pendingPhoto;await savePh(editId,pendingPhoto);}}
  }
  pendingPhoto=null;ST.editId=null;await SAVE();renderV();
}

async function delPl(id){if(!confirm('Delete this player from the roster?'))return;ST.players=ST.players.filter(p=>p.id!==id);ST.editId=null;await SAVE();renderV();}

async function userVote(){
  const name=(document.getElementById('uv-n')?.value||'').trim();
  const msg=document.getElementById('uv-m');
  if(!name){if(msg)msg.innerHTML=`<span style="color:var(--color-text-danger);">Please enter your name.</span>`;return;}
  const key=todayKey();
  if(!ST.weeks[key])ST.weeks[key]={date:key,votes:[],locked:false,teams:null};
  const week=ST.weeks[key];
  if(week.locked||week.votes.length>=TARGET){if(msg)msg.innerHTML=`<span style="color:var(--color-text-danger);">Voting is closed.</span>`;return;}
  if(week.votes.some(v=>v.name.toLowerCase()===name.toLowerCase())){if(msg)msg.innerHTML=`<span style="color:var(--color-text-warning);">${escH(name)} is already checked in.</span>`;return;}
  week.votes.push({name,timestamp:new Date().toISOString()});
  if(week.votes.length>=TARGET){week.locked=true;const r=genTeams(week.votes);week.teams={red:r.red,white:r.white,blue:r.blue,subs:r.subs};}
  await SAVE();renderV();
}

async function adminAV(weekDate){
  const name=(document.getElementById('av-n')?.value||'').trim();
  if(!name)return;
  if(!ST.weeks[weekDate])ST.weeks[weekDate]={date:weekDate,votes:[],locked:false,teams:null};
  const week=ST.weeks[weekDate];
  if(week.votes.some(v=>v.name.toLowerCase()===name.toLowerCase())){alert(`${name} is already checked in.`);return;}
  week.votes.push({name,timestamp:new Date().toISOString()});
  if(week.votes.length>=TARGET&&!week.locked){week.locked=true;const r=genTeams(week.votes);week.teams={red:r.red,white:r.white,blue:r.blue,subs:r.subs};}
  await SAVE();renderV();
}

async function rmV(weekDate,idx){
  const week=ST.weeks[weekDate];if(!week)return;
  week.votes.splice(idx,1);await SAVE();renderV();
}

async function toggleLock(weekDate){
  if(!ST.weeks[weekDate])ST.weeks[weekDate]={date:weekDate,votes:[],locked:false,teams:null};
  ST.weeks[weekDate].locked=!ST.weeks[weekDate].locked;await SAVE();renderV();
}

async function doGenT(weekDate){
  const week=ST.weeks[weekDate];if(!week)return;
  const r=genTeams(week.votes);
  week.teams={red:r.red,white:r.white,blue:r.blue,subs:r.subs};
  await SAVE();renderV();
}

async function saveGW(weekDate){
  const week=ST.weeks[weekDate];if(!week)return;
  week.gamesWon={
    red:parseInt(document.getElementById('gw-red')?.value||0),
    white:parseInt(document.getElementById('gw-white')?.value||0),
    blue:parseInt(document.getElementById('gw-blue')?.value||0)
  };
  await SAVE();renderV();
}

setInterval(()=>{
  const el=document.getElementById('abclock');
  if(el)el.textContent=nowClock();
},1000);

(async function(){
  const lc=document.getElementById('lc');
  if(lc)lc.innerHTML='<div style="text-align:center;padding:3rem;color:var(--color-text-secondary);">Loading...</div>';
  await LOAD();
  renderV();
})();
</script>
